const BANK=[
// ============ T4 (u:4) ============
{u:4,t:"El Capítulo III del Título V TREBEP (provisión de puestos):",o:["Está plenamente en vigor desde 2015","NO está en vigor por la Disposición Final 4ª TREBEP","Fue derogado por el RDL 6/2023","Solo se aplica a las CCAA"],c:1,e:"Rige materialmente la Ley 30/1984 + RD 364/1995 (RGIPP) hasta que se apruebe la ley de desarrollo."},
{u:4,t:"En el concurso específico (art. 44 RGIPP), a diferencia del ordinario:",o:["No se valoran méritos generales","Puede incluir memoria y entrevista sobre el puesto concreto","Es siempre más rápido","No cabe recurso"],c:1,e:"El ordinario valora méritos generales (grado, trabajo, cursos, antigüedad); el específico añade méritos adecuados al puesto."},
{u:4,t:"El criterio de desempate en un concurso de provisión de puestos es, en primer lugar:",o:["Mayor antigüedad","Mejor puesto de trabajo desempeñado","Sorteo","Mayor grado personal"],c:1,e:"Orden: 1º mejor puesto desempeñado, 2º mayor grado personal, 3º mayor antigüedad."},
{u:4,t:"En la libre designación, el cese del funcionario:",o:["Requiere expediente disciplinario previo","Es discrecional, con las garantías del art. 65 RGIPP (reingreso)","Solo cabe por jubilación","No está previsto en la norma"],c:1,e:"El cese discrecional se compensa con garantías de reingreso a otro puesto del mismo nivel."},
{u:4,t:"El personal directivo público profesional (RDL 6/2023, arts. 123-129) en la AGE corresponde típicamente a:",o:["Subdirectores Generales","Auxiliares administrativos","Personal laboral temporal","Personal eventual"],c:0,e:"Nombramiento por libre designación, subgrupo A1, con una duración de 5 años renovables."},
{u:4,t:"La escalera de plazos en la reasignación de efectivos es (aproximadamente):",o:["1+1+1 meses","6+3+1 meses","12+6+3 meses","3+3+3 meses"],c:1,e:"Estructura escalonada del procedimiento de reasignación de efectivos del RD 364/1995."},
{u:4,t:"Durante la expectativa de destino (art. 12 RD 365/1995), las obligaciones de aceptar puestos y concursos tienen ámbito:",o:["Nacional","Provincial","Autonómico","Municipal"],c:1,e:"Frente a la excedencia forzosa (art. 13), cuyas obligaciones son de ámbito NACIONAL. Trampa muy frecuente."},
{u:4,t:"La duración máxima de la expectativa de destino es de:",o:["6 meses","1 año","2 años","Sin límite"],c:1,e:"Tras agotarla sin reingreso, se pasa a excedencia forzosa."},
{u:4,t:"La comisión de servicios para cobertura urgente e inaplazable de un puesto tiene una duración máxima de:",o:["6 meses","1 año, prorrogable","3 años","Indefinida"],c:1,e:"Es de carácter provisional; distinta de la adscripción provisional, ligada a reingreso o remoción."},
{u:4,t:"El puesto cubierto por adscripción provisional debe convocarse a provisión definitiva en un plazo máximo de:",o:["3 meses","6 meses","1 año","2 años"],c:2,e:"Si el funcionario no participa en esa convocatoria, pasa de oficio a excedencia voluntaria por interés particular."},
{u:4,t:"La movilidad por violencia de género o terrorismo se caracteriza por:",o:["Exigir una vacante presupuestada previa","No requerir vacante y tener carácter urgente","Requerir concurso ordinario previo","Solo aplicarse en el mismo municipio"],c:1,e:"Se prioriza la protección de la persona funcionaria sobre los trámites ordinarios de provisión."},
{u:4,t:"La promoción interna vertical implica:",o:["Progresión sin cambiar de grupo","Ascenso a un cuerpo o escala de grupo superior mediante proceso selectivo","Solo cambio de puesto sin proceso selectivo","Aplicarse únicamente al grupo A1"],c:1,e:"Frente a la horizontal, que es progresión dentro del mismo cuerpo, sin cambio de grupo."},
{u:4,t:"La carrera horizontal (art. 122 RDL 6/2023) consiste en:",o:["Cambio de puesto de trabajo","Progresión por tramos sin necesidad de cambiar de puesto, ligada a la evaluación del desempeño","Ascenso de grupo mediante oposición","Un complemento de productividad renombrado"],c:1,e:"Es la principal novedad del RDL 6/2023 en materia de carrera profesional, en vigor a diferencia del Cap. III Tít. V TREBEP."},
{u:4,t:"El grado personal se adquiere, con carácter general, por el desempeño de puestos del mismo nivel durante:",o:["1 año continuado","2 años continuados o 3 con interrupción","5 años en cualquier caso","Automáticamente al superar la oposición"],c:1,e:"Regla del RGIPP para la consolidación de grado personal."},
{u:4,t:"La excedencia forzosa (art. 13 RD 365/1995), a diferencia de la expectativa de destino, tiene obligaciones de ámbito:",o:["Provincial","Nacional","Municipal","Comarcal"],c:1,e:"Además, prohíbe el desempeño de actividades en el sector público durante su vigencia."},
{u:4,t:"La permuta entre funcionarios requiere:",o:["Mutuo acuerdo, mismo cuerpo/escala y autorización de ambas Administraciones","Solo la solicitud de uno de los interesados","Convocatoria pública previa","No está permitida en la función pública"],c:0,e:"Figura excepcional de movilidad voluntaria bilateral."},
{u:4,t:"¿Qué régimen retributivo se aplica al personal directivo público profesional en cuanto a su nombramiento?",o:["Concurso de méritos reglado","Libre designación","Sorteo entre candidatos","Concurso-oposición"],c:1,e:"Coherente con la naturaleza de confianza técnica del puesto directivo."},
{u:4,t:"Un funcionario que no participa en la convocatoria del puesto que ocupa en adscripción provisional pasa de oficio a:",o:["Servicio activo en otro puesto","Excedencia voluntaria por interés particular","Suspensión de funciones","Jubilación anticipada"],c:1,e:"Consecuencia automática prevista en el RGIPP para proteger el sistema de provisión."},
{u:4,t:"La reasignación de efectivos se produce típicamente por:",o:["Sanción disciplinaria","Amortización o supresión de puestos de trabajo","Petición voluntaria del funcionario","Cambio de destino por oposición"],c:1,e:"Es un procedimiento reactivo a la reorganización administrativa, no una sanción."},
{u:4,t:"La carrera vertical se materializa a través de:",o:["La evaluación del desempeño exclusivamente","La provisión de puestos de mayor nivel","El complemento de productividad","Los trienios"],c:1,e:"Se diferencia de la carrera horizontal, que no exige cambio de puesto."},
{u:4,t:"En el concurso ordinario de provisión de puestos se valoran:",o:["Solo la entrevista personal","Méritos generales: grado personal, trabajo desarrollado, cursos de formación y antigüedad","Únicamente la antigüedad","Solo la memoria técnica"],c:1,e:"El concurso específico añade méritos adecuados a las características concretas del puesto."},
// ============ T5 (u:5) ============
{u:5,t:"El RD-ley 9/2025 (permisos de nacimiento y parental):",o:["Modifica las situaciones administrativas del art. 85 TREBEP","NO modifica las situaciones administrativas; regula permisos (art. 49 y 7.2 TREBEP)","Deroga el art. 87 TREBEP","Solo afecta al personal laboral"],c:1,e:"Trampa frecuente: confundir la reforma de permisos (2025) con las situaciones administrativas, cuyas últimas reformas son la LO 10/2022 y la LO 9/2015."},
{u:5,t:"El catálogo de situaciones administrativas del art. 85 TREBEP es:",o:["Cerrado y numerus clausus","Abierto: las leyes de función pública pueden crear otras","Aplicable solo a funcionarios interinos","Idéntico en todas las AAPP sin excepción"],c:1,e:"El propio RD 365/1995 añade situaciones adicionales (expectativa de destino, excedencia forzosa, incentivada)."},
{u:5,t:"En servicios especiales, el funcionario percibe:",o:["Las retribuciones del puesto de origen únicamente","Las retribuciones del cargo desempeñado + trienios reconocidos","Ninguna retribución","Solo el complemento de destino"],c:1,e:"El tiempo en servicios especiales computa a todos los efectos: ascensos, trienios, promoción y Seguridad Social."},
{u:5,t:"El plazo de reingreso desde servicios especiales es de:",o:["15 días","1 mes desde que cesa la causa","3 meses","6 meses"],c:1,e:"Si no se solicita en ese plazo, se pasa a excedencia voluntaria por interés particular."},
{u:5,t:"El funcionario TRANSFERIDO a una CCAA (art. 10 RD 365/1995) se encuentra, en su destino, en situación de:",o:["Servicio en otras Administraciones Públicas","Servicio activo","Excedencia voluntaria","Servicios especiales"],c:1,e:"Frente al funcionario por PROVISIÓN, que conserva plenamente el vínculo con su Administración de origen."},
{u:5,t:"La excedencia voluntaria por interés particular exige:",o:["Ningún requisito de antigüedad","5 años de servicios efectivos","2 años de servicios efectivos","10 años de servicios efectivos"],c:1,e:"Duración mínima 2 años (AGE), sin máximo. No computa a efectos de trienios ni reserva puesto."},
{u:5,t:"La excedencia por cuidado de familiares, a diferencia de la de interés particular:",o:["No computa a ningún efecto","SÍ computa a efectos de trienios, carrera y Seguridad Social","Tiene una duración máxima de 10 años","No da derecho a reserva de puesto"],c:1,e:"Máximo 3 años por sujeto causante; reserva de puesto: 2 años mismo puesto, después misma localidad."},
{u:5,t:"La excedencia por violencia de género o violencia sexual (art. 89.5, LO 10/2022) tiene una duración máxima de:",o:["6 meses","12 meses","18 meses, con prórrogas de 3 en 3 meses","Sin límite temporal"],c:2,e:"Retribuciones íntegras solo los primeros 2 meses; reserva de puesto solo los primeros 6 meses."},
{u:5,t:"La titular de la excedencia por violencia de género conserva reserva de puesto durante:",o:["Todo el periodo de excedencia","Los primeros 6 meses","Los primeros 2 meses","Nunca hay reserva de puesto"],c:1,e:"Frente a los 2 meses de retribuciones íntegras — dos plazos distintos que suelen confundirse."},
{u:5,t:"La excedencia voluntaria incentivada (art. 18 RD 365/1995) tiene una duración de:",o:["3 años","5 años","10 años","Sin plazo fijo"],c:1,e:"Con indemnización de 1 mensualidad por año, máximo 12; prohibición de sector público durante esos 5 años."},
{u:5,t:"La excedencia forzosa (art. 13 RD 365/1995) tiene obligaciones de ámbito:",o:["Provincial","Nacional","Local","Autonómico"],c:1,e:"A diferencia de la expectativa de destino (art. 12), cuyas obligaciones son de ámbito provincial."},
{u:5,t:"La suspensión provisional de funciones tiene una duración máxima de:",o:["3 meses","6 meses","1 año","2 años"],c:1,e:"Durante la suspensión provisional se perciben el 100% de las retribuciones básicas + prestaciones familiares."},
{u:5,t:"La suspensión firme por falta muy grave puede alcanzar hasta:",o:["1 año","3 años","6 años","10 años"],c:2,e:"Graves: hasta 3 años; muy graves: de 3 a 6 años. Es el límite máximo global de la suspensión firme."},
{u:5,t:"Si tras una suspensión firme el funcionario no solicita el reingreso en 6 meses, pasa a:",o:["Servicio activo automáticamente","Excedencia forzosa","Jubilación anticipada","Servicios especiales"],c:1,e:"Consecuencia prevista para evitar situaciones administrativas indefinidas sin vínculo activo."},
{u:5,t:"La regla general en materia de incompatibilidades entre dos puestos públicos (Ley 53/1984) es:",o:["Son siempre compatibles","Son incompatibles, salvo excepciones tasadas","Depende del grupo profesional","Solo se aplica a cargos electos"],c:1,e:"El tope retributivo del segundo puesto compatible es la retribución de un Director General."},
{u:5,t:"La actividad privada compatible con un puesto público requiere:",o:["Reconocimiento previo de compatibilidad","Ninguna autorización","Solo comunicación posterior","Autorización solo si supera 20 horas semanales"],c:0,e:"Si el complemento específico supera el 30% de las retribuciones básicas, la actividad privada es incompatible salvo renuncia expresa al exceso."},
{u:5,t:"El profesor asociado universitario a tiempo parcial:",o:["Es siempre incompatible con cualquier puesto público","Es compatible con cualquier puesto público","Solo es compatible con puestos A1","Requiere autorización especial del Consejo de Ministros"],c:1,e:"Excepción legal expresa de la Ley 53/1984, dada su naturaleza docente de duración determinada."},
{u:5,t:"El plazo para resolver una solicitud de compatibilidad público-privada (Ley 53/1984) es de:",o:["1 mes","2 meses","3 meses","6 meses"],c:1,e:"Frente a los 3 meses (+1 prorrogable) de la compatibilidad público-público según el RD 598/1985."},
{u:5,t:"Las actividades de formación que no requieren solicitar compatibilidad tienen un límite de:",o:["50 horas/año","75 horas/año","100 horas/año","No hay límite"],c:1,e:"Una de las 9 actividades exentas de solicitar compatibilidad expresa."},
{u:5,t:"El desempeño simultáneo de dos puestos públicos incompatibles se califica como:",o:["Falta leve","Falta grave","Falta muy grave","No constituye infracción disciplinaria"],c:2,e:"El mero incumplimiento de plazos o procedimiento se califica como falta grave (no muy grave)."},
// ============ T6 (u:6) ============
{u:6,t:"El sistema retributivo de los funcionarios de carrera se rige actualmente, en lo básico, por:",o:["El Capítulo III Título III TREBEP, plenamente vigente","La Ley 30/1984 (arts. 23 y 24), por no desarrollo del TREBEP","El RD-ley 6/2023 en su totalidad","La Ley de Presupuestos de 2015"],c:1,e:"La Disposición Final 4ª TREBEP condiciona la eficacia de su Capítulo III Título III a leyes de desarrollo aún no aprobadas."},
{u:6,t:"El precepto del TREBEP de aplicación directa en materia retributiva es:",o:["Art. 23","Art. 25.2 (trienios de interinos)","Art. 22","Art. 30"],c:1,e:"Reconoce a los interinos el derecho a trienios desde el 13 de mayo de 2007 (entrada en vigor del TREBEP)."},
{u:6,t:"El sueldo del Subgrupo A1 no puede exceder el de Agrupaciones Profesionales (art. 24 Ley 30/1984) en más de:",o:["2 veces","3 veces","5 veces","10 veces"],c:1,e:"Regla de proporcionalidad del sistema retributivo básico."},
{u:6,t:"Las pagas extraordinarias (junio y diciembre) equivalen, como mínimo, a una mensualidad de:",o:["Solo sueldo","Sueldo y trienios exclusivamente","Sueldo, trienios y complemento de destino íntegro","Todas las retribuciones incluido el específico"],c:2,e:"Trampa frecuente: olvidar que incluyen el complemento de destino completo, no solo sueldo y trienios."},
{u:6,t:"Si el cese en el servicio activo se produce por jubilación, fallecimiento o retiro, la paga extraordinaria se liquida:",o:["De forma proporcional a los días trabajados","Por mes completo, no proporcional","No se devenga","Se pierde íntegramente"],c:1,e:"Excepción expresa a la regla general de liquidación proporcional por días en el mes del cese."},
{u:6,t:"El complemento de destino en la Administración General del Estado tiene:",o:["20 niveles","25 niveles","30 niveles","15 niveles"],c:2,e:"Retribuye el nivel del puesto (no el cuerpo); se integra íntegro en las pagas extraordinarias."},
{u:6,t:"A cada puesto de trabajo se le puede asignar:",o:["Varios complementos específicos simultáneos","Un único complemento específico, aunque valore varias condiciones","Ningún complemento específico si tiene complemento de destino","Solo complemento de productividad"],c:1,e:"Regla de unicidad del complemento específico, aunque su cuantía pondere varios factores concurrentes."},
{u:6,t:"El complemento específico se percibe en:",o:["12 pagas","13 pagas","14 pagas, devengado en 12","24 pagas"],c:2,e:"Relevante para las liquidaciones proporcionales en caso de cambio de puesto o cese."},
{u:6,t:"Si el complemento específico supera el 30% de las retribuciones básicas (sin trienios), el funcionario:",o:["Puede ejercer cualquier actividad privada sin límite","No puede ejercer actividad privada, salvo renuncia expresa al exceso","Pierde automáticamente el complemento","Debe pedir excedencia"],c:1,e:"Umbral clave de incompatibilidad ligado al factor de dedicación del complemento específico."},
{u:6,t:"El complemento de productividad:",o:["Genera derechos adquiridos para periodos futuros","NO genera derechos adquiridos ni se consolida","Se convierte automáticamente en fijo tras 3 años","Sustituye siempre al complemento de destino"],c:1,e:"Su asignación en un periodo no crea expectativas para periodos sucesivos."},
{u:6,t:"Las gratificaciones por servicios extraordinarios se caracterizan por la doble prohibición de ser:",o:["Fijas y periódicas","Variables y excepcionales","Anuales y acumulables","Ninguna de las anteriores"],c:0,e:"No pueden ser fijas en cuantía ni periódicas en su devengo: son estrictamente coyunturales."},
{u:6,t:"El complemento de desempeño introducido por el RD-ley 6/2023 se regula en:",o:["El art. 122, igual que el complemento de carrera","El Capítulo I del Título III (arts. 116-121)","La Ley 30/1984","El Real Decreto 462/2002"],c:1,e:"Corrección frecuente en materiales de estudio: el art. 122 regula EXCLUSIVAMENTE la carrera horizontal, no el complemento de desempeño."},
{u:6,t:"El complemento de carrera (art. 122 RDL 6/2023) tiene una cuantía:",o:["Distinta para cada funcionario según su antigüedad","Igual para todos los funcionarios del mismo grupo/subgrupo con el mismo tramo reconocido","Fijada libremente por cada jefe de servicio","Vinculada solo a la productividad individual"],c:1,e:"Ligado al sistema de tramos de la carrera horizontal, previa evaluación del desempeño."},
{u:6,t:"La regla general de devengo de las retribuciones fijas y periódicas es:",o:["Por días naturales trabajados","Por mensualidades completas","Por horas efectivas","Por semanas"],c:1,e:"Solo en 4 supuestos tasados cabe liquidación por días (toma de posesión, inicio de licencia sin sueldo, cambio a otra AAPP, cese)."},
{u:6,t:"El plazo posesorio con derecho a retribución íntegra, si conlleva cambio de residencia, es de:",o:["3 días hábiles","15 días","1 mes","2 meses"],c:2,e:"Sin cambio de residencia el plazo posesorio se reduce a 3 días hábiles."},
{u:6,t:"El Real Decreto 462/2002 regula:",o:["El régimen disciplinario","Las indemnizaciones por razón del servicio","La carrera profesional","El acceso al empleo público"],c:1,e:"Toda concesión de indemnizaciones fuera de sus previsiones se considera nula (principio de legalidad)."},
{u:6,t:"La residencia eventual (art. 16 RD 462/2002) se caracteriza por:",o:["Requerir justificación documental de gastos, igual que las dietas","No requerir justificación documental; cuantía máxima 80% de la dieta entera","Ser incompatible con los gastos de viaje","Solo aplicarse a comisiones en el extranjero"],c:1,e:"Diferencia clave frente a las dietas ordinarias, que sí exigen justificar el alojamiento."},
{u:6,t:"Una comisión de servicio en territorio nacional se convierte en residencia eventual cuando su duración prevista supera:",o:["15 días","1 mes","3 meses","6 meses"],c:1,e:"En el extranjero el umbral es de 3 meses."},
{u:6,t:"El límite global conjunto de asistencias (órganos colegiados + tribunales + formación) sobre las retribuciones anuales del puesto es:",o:["30%","40%","50%","60%"],c:2,e:"Límites individuales: órganos colegiados 40%, tribunales 20%, formación no habitual 25%; el conjunto no puede superar el 50%."},
{u:6,t:"En un traslado forzoso de residencia motivado por sanción disciplinaria, el funcionario:",o:["Tiene derecho a indemnización completa","NO tiene derecho a indemnización por traslado","Solo tiene derecho a gastos de viaje","Tiene derecho al doble de dietas"],c:1,e:"Exclusión expresa del régimen indemnizatorio de traslados del art. 23 RD 462/2002."},
];
const CATS_LABEL=UNIDADES;
let filtered=[...BANK], mode='normal', curTab=0;
function loadHist(){try{return JSON.parse(localStorage.getItem(LS_KEY)||'{}')}catch(e){return{}}}
function saveHist(h){localStorage.setItem(LS_KEY,JSON.stringify(h))}
function qid(q){return q.u+'|'+q.t.slice(0,60)}
function buildTabs(){
  const tabs=document.getElementById('tabs');
  tabs.innerHTML='<button class="tab on" data-u="0">Todos</button>'+Object.entries(UNIDADES).map(([k,v])=>`<button class="tab" data-u="${k}">${v}</button>`).join('');
  tabs.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tabs.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');curTab=+b.dataset.u;applyFilter();render(false)});
}
function applyFilter(){
  let base = curTab===0?[...BANK]:BANK.filter(q=>q.u===curTab);
  const hist=loadHist();
  if(mode==='fail'){base=base.filter(q=>{const h=hist[qid(q)];return h&&h.wrong>0&&(h.wrong>=h.right)})}
  if(mode==='adapt'){base=base.map(q=>{const h=hist[qid(q)]||{right:0,wrong:0};const score=h.right-h.wrong;return{q,score}}).sort((a,b)=>a.score-b.score).slice(0,20).map(x=>x.q)}
  filtered=base;
}
function buildBars(){
  const hist=loadHist();
  const bars=document.getElementById('bars');
  bars.innerHTML=Object.entries(UNIDADES).map(([k,v])=>{
    const qs=BANK.filter(q=>q.u==k);
    let right=0,total=0;
    qs.forEach(q=>{const h=hist[qid(q)];if(h){total+=h.right+h.wrong;right+=h.right}});
    const pct=total>0?Math.round(100*right/total):0;
    const col=pct>=70?'#16a34a':pct>=40?'#ea580c':'#dc2626';
    return `<div class="bar"><div class="lbl"><span>${v}</span><span>${pct}%</span></div><div class="track"><div class="fill" style="width:${pct}%;background:${col}"></div></div></div>`;
  }).join('');
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function render(doShuffle){
  applyFilter();
  if(doShuffle)shuffle(filtered);
  const quiz=document.getElementById('quiz');
  quiz.innerHTML='';
  filtered.forEach((q,idx)=>{
    const div=document.createElement('div');div.className='q';
    div.innerHTML=`<div class="meta"><span>${UNIDADES[q.u]}</span><span>#${idx+1}/${filtered.length}</span></div><h3>${q.t}</h3>`+
      q.o.map((o,i)=>`<button class="opt" data-i="${i}">${o}</button>`).join('')+
      `<div class="exp" id="exp${idx}"><b>Explicación:</b> ${q.e}</div>`;
    quiz.appendChild(div);
    div.querySelectorAll('.opt').forEach(btn=>{
      btn.onclick=()=>{
        if(btn.disabled)return;
        const opts=div.querySelectorAll('.opt');
        opts.forEach(o=>o.disabled=true);
        const hist=loadHist();const id=qid(q);const h=hist[id]||{right:0,wrong:0};
        if(+btn.dataset.i===q.c){btn.classList.add('ok');h.right++}
        else{btn.classList.add('ko');opts[q.c].classList.add('ok');h.wrong++}
        hist[id]=h;saveHist(hist);
        document.getElementById('exp'+idx).classList.add('show');
        updateScore();buildBars();
      };
    });
  });
  updateScore();buildBars();
}
function showAll(){document.querySelectorAll('.exp').forEach(e=>e.classList.add('show'))}
function resetHist(){if(confirm('¿Reiniciar todo el historial de este test?')){localStorage.removeItem(LS_KEY);buildBars();updateScore()}}
function updateScore(){
  const hist=loadHist();let right=0,wrong=0;
  Object.values(hist).forEach(h=>{right+=h.right;wrong+=h.wrong});
  const total=right+wrong;
  document.getElementById('score').innerHTML=total>0?`Aciertos históricos: <b>${right}</b> / ${total} (${Math.round(100*right/total)}%)`:'Aún sin respuestas registradas';
}
document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>{document.querySelectorAll('.mode').forEach(x=>x.classList.remove('on'));b.classList.add('on');mode=b.dataset.m;render(false)});
buildTabs();applyFilter();render(false);
</script>
