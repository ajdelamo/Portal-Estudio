<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GACE 2027 · Bloque IV · Tema 5 · Flashcards</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f4;color:#1a1a18;min-height:100vh;padding:1rem}
.wrap{max-width:680px;margin:0 auto}
.back{display:inline-block;font-size:12px;color:#185fa5;text-decoration:none;margin-bottom:.6rem}
h1{font-size:17px;font-weight:600;margin-bottom:1rem}
.nav{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:.7rem}
.nb{padding:5px 12px;border:1px solid #d3d1c7;border-radius:8px;background:#fff;color:#5f5e5a;font-size:13px;cursor:pointer}
.nb.active{background:#e6f1fb;color:#185fa5;border-color:#185fa5}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:.7rem}
.stat{background:#fff;border:1px solid #d3d1c7;border-radius:8px;padding:.55rem;text-align:center}
.stat-n{font-size:19px;font-weight:600}.stat-l{font-size:11px;color:#888780}
.ctrl{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:.9rem}
.btn{padding:6px 13px;border:1px solid #d3d1c7;border-radius:8px;background:#fff;color:#1a1a18;font-size:13px;cursor:pointer}
.btn.active{background:#e6f1fb;color:#185fa5;border-color:#185fa5}
.btn.danger{background:#fcebeb;color:#a32d2d;border-color:#f7c1c1}
.card{background:#fff;border:1.5px solid #d3d1c7;border-radius:14px;min-height:260px;padding:22px 22px 18px;cursor:pointer;display:flex;flex-direction:column;user-select:none}
.card:focus-visible{outline:3px solid #185fa5;outline-offset:2px}
.card.back-side{border-color:#185fa5;background:#fbfdff}
.meta{display:flex;justify-content:space-between;font-size:11px;color:#888780;margin-bottom:12px}
.face{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;font-size:17px;line-height:1.55;white-space:pre-line}
.back-side .face{font-size:15px;text-align:left;justify-content:flex-start;align-items:flex-start}
.hint{font-size:11px;color:#b4b2a9;text-align:center;margin-top:12px}
.answer{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.answer button{padding:12px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;border:1.5px solid}
.no{background:#fcebeb;color:#a32d2d;border-color:#f7c1c1}
.si{background:#eaf3de;color:#0f6e56;border-color:#a6d9b8}
.answer button:disabled{opacity:.4;cursor:default}
.dots{display:flex;gap:3px;flex-wrap:wrap;margin-top:14px}
.dot{width:9px;height:9px;border-radius:2px;background:#e4e2db}
.dot.ok{background:#1d9e75}.dot.ko{background:#e24b4a}.dot.cur{outline:2px solid #185fa5}
.empty{color:#888780;font-size:14px;padding:3rem;text-align:center;background:#fff;border-radius:12px;border:1px solid #d3d1c7}
</style>
</head>
<body>
<div class="wrap">
<a class="back" href="../index.html">← Portal de Estudio</a>
<h1>🃏 GACE 2027 · Bloque IV · Tema 5 · Flashcards</h1>
<div class="nav" id="nav"></div>
<div class="stats" id="stats"></div>
<div class="ctrl" id="ctrl"></div>
<div id="stage"></div>
</div>
<script>
const CARDS=[{"u": 1, "f": "Art. 1 LCSP: principios", "b": "Libertad de acceso a las licitaciones · publicidad y transparencia · no discriminación e igualdad de trato · eficiente utilización de los fondos (con estabilidad presupuestaria, control del gasto e integridad). 1.3: criterios sociales y medioambientales transversales; acceso de pymes y economía social."}, {"u": 1, "f": "LCSP: datos de identidad", "b": "Ley 9/2017, de 8 de noviembre · transpone Directivas 2014/23/UE (concesiones) y 2014/24/UE · en vigor 9/3/2018 · 4 libros y 347 artículos · Libro II (64-315): contratos de las AAPP."}, {"u": 1, "f": "Normas de desarrollo y conexas", "b": "RD 1098/2001 (Reglamento General, en lo que no se oponga) · RD 817/2009 · RDL 3/2020 (sectores especiales) · RD 814/2015 (recursos) · título: art. 149.1.18.ª CE."}, {"u": 1, "f": "Cambios 2024-2026 en la LCSP", "b": "Art. 71 (agosto 2024) · umbrales 2026-2027 (Orden HAC/1517/2025) · art. 202: desperdicio alimentario (Ley 1/2025) · DA 4.ª: reserva estatal del 10 % al 15 % (Ley 1/2026, de 8 de abril)."}, {"u": 1, "f": "Los tres círculos del art. 3", "b": "Sector público (aplicación mínima) ⊃ poderes adjudicadores (preparación y adjudicación) ⊃ Administraciones Públicas (únicas que celebran contratos administrativos). EPE y sociedades mercantiles: no son AAPP."}, {"u": 1, "f": "¿Poder adjudicador? (examen 2024)", "b": "SÍ: AAPP, fundaciones públicas, mutuas colaboradoras con la Seguridad Social.\nNO: asociaciones inscritas en el Registro Nacional de Asociaciones."}, {"u": 1, "f": "Partidos, sindicatos y organizaciones empresariales (3.4)", "b": "Si reúnen los requisitos de poder adjudicador: solo respetan los principios (publicidad, concurrencia, transparencia, igualdad, no discriminación) y solo en contratos SARA."}, {"u": 1, "f": "Negocios excluidos (arts. 4-11)", "b": "Relaciones funcionariales y laborales · convenios · encargos a medios propios (32-33) · inmuebles (compraventa, donación, permuta, arrendamiento) · autorizaciones y concesiones demaniales · ciertos servicios financieros e I+D · defensa (Ley 24/2011)."}, {"u": 2, "f": "Concepto de contrato del sector público (art. 2)", "b": "Contratos onerosos, cualquiera que sea su naturaleza, celebrados por entidades del sector público. Oneroso: el contratista obtiene un beneficio económico, directo o indirecto."}, {"u": 2, "f": "Los contratos típicos", "b": "Obras (13) · concesión de obras (14) · concesión de servicios (15) · suministro (16) · servicios (17) · mixto (18: prestación principal). Concesiones: riesgo operacional."}, {"u": 2, "f": "Administrativo especial (25.1.b)", "b": "Objeto distinto de los típicos, pero vinculado al giro o tráfico específico de la Administración o a una finalidad pública de su competencia. Ejemplo: cafetería de un edificio público."}, {"u": 2, "f": "Contratos privados (art. 26)", "b": "Preparación y adjudicación: LCSP (contencioso). Efectos y extinción: Derecho privado (civil), salvo obligaciones sociales y laborales, condiciones especiales, modificación (contencioso, art. 27), cesión, subcontratación y racionalización."}, {"u": 2, "f": "PBL · valor estimado · precio", "b": "PBL (100): límite de gasto, CON IVA.\nValor estimado (101): SIN IVA, con prórrogas, opciones y modificaciones previstas; decide publicidad y procedimiento.\nPrecio (102): cierto, en euros, IVA aparte."}, {"u": 2, "f": "Umbrales SARA 2026", "b": "Obras y concesiones: 5.404.000 € · suministros y servicios AGE: 140.000 € · resto de poderes adjudicadores: 216.000 € · servicios sociales del anexo IV: 750.000 €. Fuente: Reglamentos Delegados (UE) 2025/2151 y 2152 · Orden HAC/1517/2025."}, {"u": 2, "f": "Regla de lotes SARA", "b": "Si el valor acumulado alcanza el umbral, todos son SARA, salvo lotes de obras < 1.000.000 € y de suministros/servicios < 80.000 €, si no superan el 20 % del valor acumulado."}, {"u": 3, "f": "Órgano de contratación y Consejo de Ministros", "b": "AGE: Ministros y Secretarios de Estado (323). Autorización del Consejo de Ministros: valor estimado ≥ 12 M€ (324)."}, {"u": 3, "f": "Mesa de contratación (326)", "b": "Obligatoria: abierto, simplificado (no sumario), restringido, diálogo, licitación con negociación, asociación para la innovación. Potestativa: negociado sin publicidad. Vocales obligatorios: asesor jurídico e interventor. Diálogo: ⅓ de expertos."}, {"u": 3, "f": "Aptitud del contratista (65)", "b": "Plena capacidad de obrar · no incurso en prohibición · solvencia acreditada o clasificación. UTE: escritura tras la adjudicación, responsabilidad solidaria."}, {"u": 3, "f": "Prohibiciones de contratar (71-73)", "b": "Condenas penales (corrupción, fraude, blanqueo…) · sanciones graves · concurso · no estar al corriente con Hacienda y Seguridad Social · falsedad · incompatibilidades · no formalizar o resolución por culpa. Duración máx. general: 3 años."}, {"u": 3, "f": "Solvencia: cifras", "b": "Económica: volumen anual ≤ 1,5 × valor estimado (mejor de 3 últimos ejercicios). Técnica: obras de los últimos 5 años; suministros y servicios de los últimos 3. Corrección: no son 10 años en obras."}, {"u": 3, "f": "Clasificación", "b": "Exigible en obras con valor estimado ≥ 500.000 €; sustituye a la solvencia. Potestativa por debajo y en servicios. Vigencia indefinida: justificación anual (económica) y trienal (técnica). ROLECE acredita capacidad, solvencia y ausencia de prohibiciones."}, {"u": 3, "f": "Garantías: cuantías", "b": "Provisional: ≤ 3 % PBL, excepcional y prohibida en el simplificado.\nDefinitiva: 5 % del precio ofertado sin IVA.\nComplementaria: hasta otro 5 % (máx. 10 %). Devolución en 2 meses."}, {"u": 3, "f": "Perfección y forma", "b": "Se perfecciona con la FORMALIZACIÓN (36). No cabe contratación verbal salvo emergencia (37). Documento administrativo, título para registros; escritura pública a costa del contratista."}, {"u": 3, "f": "Duración (art. 29)", "b": "Servicios y suministros de prestación sucesiva: máx. 5 años con prórrogas. Prórroga obligatoria con preaviso de 2 meses. Menor: 1 año, sin prórroga. Acuerdo marco: 4 años."}, {"u": 4, "f": "Expediente de contratación: pasos", "b": "Inicio motivando la necesidad (28) · memoria justificativa · PCAP y PPT · certificado de crédito y fiscalización · aprobación del expediente y del gasto. PCAG: Consejo de Ministros + dictamen del Consejo de Estado."}, {"u": 4, "f": "Urgente vs emergencia", "b": "Urgente (119): plazos a la mitad, ejecución en ≤ 1 mes, cabe recurso especial.\nEmergencia (120): sin expediente, puede ser verbal, ejecución en 1 mes, NO cabe recurso especial."}, {"u": 4, "f": "Contrato menor (118)", "b": "< 40.000 € obras · < 15.000 € suministros y servicios · informe de necesidad + aprobación del gasto + factura · justificar que no se altera el objeto · 1 año sin prórroga ni revisión · publicación trimestral (63.4). Ciencia: hasta 50.000 €."}, {"u": 4, "f": "Contrato menor tras el RDL 3/2020", "b": "Suprimido el límite anual por proveedor (antiguo 118.3). Solo se justifica que no se altera el objeto para eludir las reglas generales."}, {"u": 5, "f": "Abierto: plazos de ofertas", "b": "SARA: 35 días (obras, suministros, servicios), 30 en concesiones, desde el envío al DOUE; −5 si electrónico; 15 con anuncio previo.\nNo SARA: 15 días suministros y servicios; 26 obras y concesiones."}, {"u": 5, "f": "Abierto simplificado (159)", "b": "Obras ≤ 2.000.000 € · suministros y servicios < umbral SARA · juicio de valor ≤ 25 % (45 % intelectuales) · 15 días (20 obras) · ROLECE · sin garantía provisional · documentación en 7 días hábiles."}, {"u": 5, "f": "Simplificado sumario (159.6)", "b": "Obras < 80.000 € · suministros y servicios < 60.000 € (no intelectuales) · 10 días hábiles (5 bienes de mercado) · solo criterios automáticos · exime de solvencia · sin garantía definitiva ni mesa obligatoria."}, {"u": 5, "f": "Restringido · negociación · diálogo", "b": "Restringido: mínimo 5 candidatos, sin negociar.\nLicitación con negociación: mínimo 3, nunca se negocian requisitos mínimos ni criterios.\nDiálogo competitivo: mínimo 3, mesa con ⅓ de expertos, primas posibles."}, {"u": 5, "f": "Negociado sin publicidad (168): supuestos", "b": "Licitación desierta · exclusividad técnica o artística · imperiosa urgencia · entregas complementarias (≤ 3 años) · repetición de obras o servicios similares (≤ 3 años) · mercados organizados."}, {"u": 5, "f": "Criterios de adjudicación (145-146)", "b": "Mejor relación calidad-precio: económicos y cualitativos · ciclo de vida · vinculados al objeto. Juicio de valor se valora ANTES; si pesa más que los automáticos, lo valora un comité de expertos."}, {"u": 5, "f": "Ofertas anormalmente bajas (149)", "b": "Parámetros de los pliegos → requerimiento al licitador para justificar + informe técnico → exclusión solo si no se justifica. Sin audiencia, la exclusión es contraria a Derecho."}, {"u": 5, "f": "Del 150 al 154: plazos", "b": "Requerimiento al mejor clasificado: 10 días hábiles (7 simplificado) · adjudicación: 5 días hábiles · publicación: 15 días · formalización con recurso especial: no antes de 15 días hábiles + 5 días · sin recurso especial: dentro de 15 días hábiles."}, {"u": 5, "f": "Publicidad y nulidad", "b": "Perfil de contratante en la Plataforma de Contratación (347) y DOUE si SARA. Falta de publicación del anuncio en el perfil = nulidad (39.2.c, examen 2022)."}, {"u": 6, "f": "Prerrogativas (190)", "b": "Interpretar · modificar · declarar la responsabilidad del contratista · suspender · resolver · inspeccionar. Audiencia + informe jurídico. Inmediatamente ejecutivos."}, {"u": 6, "f": "Dictamen del Consejo de Estado (191.3)", "b": "Interpretación, nulidad y resolución con OPOSICIÓN del contratista · modificaciones NO previstas > 20 % del precio inicial si este ≥ 6 M€. Con el 20 % exacto, no hay dictamen."}, {"u": 6, "f": "Demora: penalidades (193)", "b": "0,60 € por cada 1.000 € del precio (sin IVA) y día, salvo pliegos. Cada múltiplo del 5 % del precio: puede resolverse. Se cobran del precio o de la garantía."}, {"u": 6, "f": "Pago del precio (198)", "b": "30 días para la conformidad + 30 días para pagar. Más de 4 meses: el contratista puede SUSPENDER (preaviso 1 mes). Más de 6 meses: puede RESOLVER e indemnización."}, {"u": 6, "f": "Daños a terceros (196)", "b": "Indemniza el contratista, salvo orden inmediata y directa de la Administración (o vicios del proyecto en obras): entonces la Administración."}, {"u": 6, "f": "Cesión y subcontratación", "b": "Cesión (214): autorización previa, 20 % ejecutado, cesionario capaz y solvente, escritura pública.\nSubcontratación (215-216): comunicación previa, principal responde, pago en 60 días, penalidad hasta 50 %."}, {"u": 6, "f": "Causas de resolución (211)", "b": "Muerte o extinción · concurso · mutuo acuerdo · demora del contratista · demora en el pago > 6 meses · incumplimiento esencial · imposibilidad o lesión grave al interés público · impago de salarios o incumplimiento del convenio."}, {"u": 6, "f": "Efectos de la resolución (213)", "b": "Culpa del contratista: incautación de la garantía + daños que excedan. Causa 211.1.g: 3 % de la prestación dejada de realizar. Corrección: el 3 % no se aplica a cualquier causa imputable a la Administración."}, {"u": 6, "f": "Recepción (210)", "b": "Acto formal y positivo dentro del mes siguiente a la entrega. Desde ahí corre el plazo de garantía."}, {"u": 7, "f": "Revisión de precios (103-105)", "b": "Periódica y predeterminada · obras, armas y equipamiento, energía, contratos con recuperación de la inversión ≥ 5 años · requisitos: 20 % ejecutado Y 2 años desde la formalización · no amortizaciones, costes financieros, gastos generales ni beneficio · no en menores · RDL 3/2022 excepcional."}, {"u": 7, "f": "Modificación: límites", "b": "Prevista (204): hasta el 20 %.\nNo prevista (205): prestaciones adicionales o imprevisibles hasta el 50 %; no sustanciales.\nObligatoria (206): hasta el 20 %; por encima, el contratista puede negarse y se resuelve."}, {"u": 7, "f": "Nulidad del art. 39", "b": "Causas del 47 Ley 39/2015 · falta de capacidad o SOLVENCIA (examen 2019) o prohibición · falta de crédito · falta de publicación en perfil o DOUE (examen 2022) · formalización anticipada con otras infracciones · incumplimiento grave del Derecho UE declarado por el TJUE."}, {"u": 7, "f": "Anulabilidad (40) y efectos (41-42)", "b": "Anulable: demás infracciones, modificaciones ilegales, encargos sin requisitos del 32. Efectos: liquidación, restitución recíproca, indemniza el culpable. Grave trastorno al servicio: continuación de efectos."}, {"u": 7, "f": "Recurso especial: ámbito", "b": "Obras y concesiones > 3.000.000 € · suministros y servicios > 100.000 €. Actos: anuncios y pliegos, trámite cualificado (exclusiones), adjudicación, modificaciones ilegales, encargos ilegales. No en emergencia."}, {"u": 7, "f": "Recurso especial: régimen", "b": "Potestativo y gratuito · 15 días hábiles · TACRC (miembros por 6 años) · suspensión automática solo contra la adjudicación · resolución en 5 días hábiles · multa 1.000-30.000 € · después, contencioso."}, {"u": 8, "f": "Introducción de contratación: las cuatro piezas", "b": "1) Constitución: art. 149.1.18.ª · 2) Ley 9/2017 (en adelante, LCSP), que transpone las Directivas 2014/23 y 2014/24 · 3) RD 1098/2001, en lo que no se oponga · 4) objeto: principios del art. 1; umbrales de la Orden HAC/1517/2025."}, {"u": 8, "f": "Calificación previa de un contrato", "b": "Con carácter previo, procede calificar: oneroso (2) · poder adjudicador y AP (3) · tipo (13-17) · administrativo (25) · valor estimado sin IVA con prórrogas (101) y SARA (20-22) · órgano de contratación (323) · jurisdicción (27)."}, {"u": 8, "f": "Mini-supuesto: servicio informático de Hacienda", "b": "75.000 € × 3 años = 225.000 € > 140.000 € → SARA, abierto (no simplificado) · exclusión sin audiencia contraria al 149.4 → recurso especial ante el TACRC en 15 días hábiles (suponemos sin festivos: hasta el 25 de mayo) · garantía: 5 % de 130.000 € = 6.500 €."}, {"u": 8, "f": "Dato que falta en el enunciado", "b": "Se escribe: «El enunciado no precisa…, por lo que suponemos que…» y después: «Por tanto, se concluye que…». Nunca un condicional dubitativo en la conclusión ni coletillas de cierre."}];
const UNAMES={"1": "Marco y ámbito", "2": "Clases y magnitudes", "3": "Elementos", "4": "Preparación", "5": "Adjudicación", "6": "Ejecución y extinción", "7": "Modificación, invalidez y recursos", "8": "Supuesto"};
const SK="gace27_biv_t05_fc_v1";
let db=(()=>{try{const r=localStorage.getItem(SK);return r?JSON.parse(r):{}}catch(e){return{}}})();
function save(){try{localStorage.setItem(SK,JSON.stringify(db))}catch(e){}}
function r(i){return db[i]||{ok:0,ko:0,last:null}}
let st={unit:0,mode:"all",order:[],pos:0,flipped:false};
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function build(){
  let ids=CARDS.map((c,i)=>i).filter(i=>st.unit===0||CARDS[i].u===st.unit);
  if(st.mode==="pend")ids=ids.filter(i=>r(i).last!=="ok");
  st.order=shuffle(ids);st.pos=0;st.flipped=false;
}
function renderNav(){
  const t=[{v:0,l:"Todo el tema"},...Object.keys(UNAMES).map(k=>({v:+k,l:UNAMES[k]}))];
  document.getElementById("nav").innerHTML=t.map(x=>`<button class="nb${st.unit===x.v?" active":""}" onclick="setUnit(${x.v})">${x.l}</button>`).join("");
}
function renderStats(){
  const ids=CARDS.map((c,i)=>i).filter(i=>st.unit===0||CARDS[i].u===st.unit);
  const ok=ids.filter(i=>r(i).last==="ok").length, ko=ids.filter(i=>r(i).last==="ko").length;
  document.getElementById("stats").innerHTML=`<div class="stat"><div class="stat-n" style="color:#0f6e56">${ok}</div><div class="stat-l">Sabidas</div></div><div class="stat"><div class="stat-n" style="color:#a32d2d">${ko}</div><div class="stat-l">Por repasar</div></div><div class="stat"><div class="stat-n">${ids.length-ok-ko}</div><div class="stat-l">Sin ver</div></div>`;
}
function renderCtrl(){
  document.getElementById("ctrl").innerHTML=`<button class="btn${st.mode==="all"?" active":""}" onclick="setMode('all')">Todas</button><button class="btn${st.mode==="pend"?" active":""}" onclick="setMode('pend')">Solo pendientes</button><button class="btn" onclick="build();render()">🔀 Barajar</button><button class="btn danger" style="margin-left:auto" onclick="resetAll(this)">Reiniciar progreso</button>`;
}
function resetAll(b){
  if(b.dataset.armed){db={};save();build();renderAll();return}
  b.dataset.armed="1";b.textContent="Pulsa otra vez para borrar";
  setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent="Reiniciar progreso"}},3000);
}
function render(){
  renderStats();
  const s=document.getElementById("stage");
  if(!st.order.length){s.innerHTML=`<div class="empty">${st.mode==="pend"?"No te queda ninguna pendiente en este bloque. Pulsa «Todas» para repasar el mazo completo.":"No hay tarjetas en este bloque."}</div>`;return}
  if(st.pos>=st.order.length){s.innerHTML=`<div class="empty">Ronda terminada.<br><br><button class="btn active" onclick="build();render()">Empezar otra ronda</button></div>`;return}
  const i=st.order[st.pos],c=CARDS[i];
  s.innerHTML=`<div class="card${st.flipped?" back-side":""}" tabindex="0" role="button" aria-label="Girar tarjeta" onclick="flip()" onkeydown="if(event.key==='Enter'){flip()}">
    <div class="meta"><span>${UNAMES[c.u]}</span><span>${st.pos+1} / ${st.order.length}</span></div>
    <div class="face">${st.flipped?c.b:c.f}</div>
    <div class="hint">${st.flipped?"¿La sabías?":"Toca la tarjeta o pulsa espacio para ver la respuesta"}</div></div>
    <div class="answer"><button class="no" ${st.flipped?"":"disabled"} onclick="mark('ko')">✗ No la sabía</button><button class="si" ${st.flipped?"":"disabled"} onclick="mark('ok')">✓ La sabía</button></div>
    <div class="dots">${st.order.map((id,k)=>`<span class="dot ${r(id).last==="ok"?"ok":r(id).last==="ko"?"ko":""}${k===st.pos?" cur":""}"></span>`).join("")}</div>`;
}
function flip(){st.flipped=!st.flipped;render()}
function mark(v){const i=st.order[st.pos],x=r(i);x[v]++;x.last=v;db[i]=x;save();if(v==="ko")st.order.push(i);st.pos++;st.flipped=false;render()}
function setUnit(u){st.unit=u;build();renderAll()}
function setMode(m){st.mode=m;build();renderAll()}
function renderAll(){renderNav();renderCtrl();render()}
document.addEventListener("keydown",e=>{if(e.target.tagName==="BUTTON")return;if(e.code==="Space"){e.preventDefault();flip()}else if(st.flipped&&e.key==="ArrowRight")mark("ok");else if(st.flipped&&e.key==="ArrowLeft")mark("ko")});
build();renderAll();
</script>
</body>
</html>
