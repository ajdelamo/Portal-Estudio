<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GACE 2027 · Bloque V · Tema 3 · Flashcards</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f4;color:#1a1a18;min-height:100vh;padding:1rem}
.wrap{max-width:680px;margin:0 auto}
.back{display:inline-block;font-size:12px;color:#185fa5;text-decoration:none;margin-bottom:.6rem}
h1{font-size:17px;font-weight:600;margin-bottom:1rem}
.nav{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:.7rem}
.nb{padding:5px 12px;border:1px solid #d3d1c7;border-radius:8px;background:#fff;color:#5f5e5a;font-size:13px;cursor:pointer}
.nb.active{background:#e6f1fb;color:#185fa5;border-color:#185fa5}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:.7rem}
.stat{background:#fff;border:1px solid #d3d1c7;border-radius:8px;padding:.55rem;text-align:center}
.stat-n{font-size:19px;font-weight:600}.stat-l{font-size:11px;color:#888780}
.ctrl{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:.9rem}
.btn{padding:6px 13px;border:1px solid #d3d1c7;border-radius:8px;background:#fff;color:#1a1a18;font-size:13px;cursor:pointer}
.btn.active{background:#e6f1fb;color:#185fa5;border-color:#185fa5}
.btn.danger{background:#fcebeb;color:#a32d2d;border-color:#f7c1c1}
.card{background:#fff;border:1.5px solid #d3d1c7;border-radius:14px;min-height:260px;padding:22px 22px 18px;cursor:pointer;display:flex;flex-direction:column;user-select:none}
.card:focus-visible{outline:3px solid #185fa5;outline-offset:2px}
.card.back-side{border-color:#185fa5;background:#fbfdff}
.meta{display:flex;justify-content:space-between;font-size:11px;color:#888780;margin-bottom:12px}
.face{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;font-size:17px;line-height:1.55;white-space:pre-line}
.back-side .face{font-size:15px;text-align:left;justify-content:flex-start;align-items:flex-start}
.hint{font-size:11px;color:#b4b2a9;text-align:center;margin-top:12px}
.answer{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.answer button{padding:12px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;border:1.5px solid}
.no{background:#fcebeb;color:#a32d2d;border-color:#f7c1c1}
.si{background:#eaf3de;color:#0f6e56;border-color:#a6d9b8}
.answer button:disabled{opacity:.4;cursor:default}
.dots{display:flex;gap:3px;flex-wrap:wrap;margin-top:14px}
.dot{width:9px;height:9px;border-radius:2px;background:#e4e2db}
.dot.ok{background:#1d9e75}.dot.ko{background:#e24b4a}.dot.cur{outline:2px solid #185fa5}
.empty{color:#888780;font-size:14px;padding:3rem;text-align:center;background:#fff;border-radius:12px;border:1px solid #d3d1c7}
</style>
</head>
<body>
<div class="wrap">
<a class="back" href="../index.html">← Portal de Estudio</a>
<h1>🃏 GACE 2027 · Bloque V · Tema 3 · Flashcards</h1>
<div class="nav" id="nav"></div>
<div class="stats" id="stats"></div>
<div class="ctrl" id="ctrl"></div>
<div id="stage"></div>
</div>
<script>
const CARDS=[{"u": 1, "f": "Objetivo de la planificación (art. 69.1 TREBEP)", "b": "Eficacia en la prestación de los servicios y eficiencia en el uso de los recursos, mediante la dimensión adecuada de efectivos, distribución, formación, promoción y movilidad."}, {"u": 1, "f": "Medidas de los planes de ordenación (art. 69.2)", "b": "a) análisis de disponibilidades y necesidades · b) organización del trabajo y estructuras de puestos · c) movilidad (suspender incorporaciones externas, concursos limitados) · d) promoción interna, formación y movilidad forzosa · e) previsión de la oferta."}, {"u": 1, "f": "Marco normativo de la planificación", "b": "TREBEP arts. 69-77 · Real Decreto-ley 6/2023, arts. 106-111 · Orden TDF/380/2024, de 26 de abril · Ley 30/1984 en lo vigente."}, {"u": 1, "f": "Planificación estratégica (art. 107 Real Decreto-ley 6/2023)", "b": "Escenario plurianual de empleo público, periódicamente revisable, dentro de las previsiones presupuestarias. Planes generales, específicos y de reestructuración, con negociación colectiva previa y evaluación posterior."}, {"u": 1, "f": "Planes específicos (Orden TDF/380/2024)", "b": "Los aprueban los departamentos, uno por área funcional, en el primer trimestre del año."}, {"u": 1, "f": "Plan general (Orden TDF/380/2024)", "b": "Lo aprueba la Secretaría de Estado de Función Pública cada año, en los dos meses siguientes a los específicos, con diagnóstico a tres años. Antes de la orden de elaboración de los Presupuestos."}, {"u": 1, "f": "Planes de reestructuración", "b": "Por cambios tecnológicos u organizativos en un sector. Iniciativa de departamentos, organismos o el ministerio; los aprueba la Secretaría de Estado de Función Pública previa negociación."}, {"u": 1, "f": "Planes de ordenación y de empleo en la AGE", "b": "Iniciativa del ministerio afectado; aprobación por la Secretaría de Estado de Función Pública, previo informe favorable de Hacienda y negociación sindical."}, {"u": 2, "f": "Contenido mínimo de la RPT (art. 74 TREBEP)", "b": "Denominación · grupos de clasificación · cuerpos o escalas · sistemas de provisión · retribuciones complementarias. Son públicas."}, {"u": 2, "f": "RPT en la Administración del Estado (art. 109)", "b": "Incluyen puestos funcionariales, laborales y eventuales; denominaciones tipo en lenguaje no sexista. Las aprueba la CECIR."}, {"u": 2, "f": "Unidades que no son órganos", "b": "Se crean, modifican y suprimen a través de las RPT (art. 59.2 Ley 40/2015)."}, {"u": 2, "f": "Estructuración de puestos (art. 110)", "b": "Niveles según responsabilidad · análisis del perfil de competencias para crear o modificar puestos · áreas funcionales."}, {"u": 2, "f": "Concurso abierto y permanente (art. 111)", "b": "Lo convoca la Secretaría de Estado de Función Pública con los departamentos, para plazas de necesaria cobertura y movilidad ordenada."}, {"u": 2, "f": "Registro Central de Personal: plazos", "b": "Comunicación en 3 días; asiento en 3 días · provisionales 90 días naturales + 90 · procedimientos especiales para contratos o interinidades de menos de 6 meses."}, {"u": 2, "f": "Registro Central de Personal: reglas", "b": "Gestionado por la Dirección General de la Función Pública · sin comunicación previa no se pagan nuevas retribuciones en nómina · sin datos de raza, religión u opinión (art. 13.5 Ley 30/1984) · portal Funciona."}, {"u": 3, "f": "Art. 70 TREBEP: las tres cifras", "b": "Necesidades con asignación presupuestaria · obligación de convocar las plazas comprometidas + hasta 10 % adicional · ejecución en 3 años improrrogables · aprobación anual y publicación en diario oficial."}, {"u": 3, "f": "Art. 108.2 Real Decreto-ley 6/2023: plazos", "b": "Convocatorias en el mismo año natural de la oferta · ejecución en 2 años desde su publicación · fase de oposición en 1 año salvo causa justificada."}, {"u": 3, "f": "Plazas no cubiertas", "b": "Pueden reconvocarse si no han pasado más de 3 años desde la publicación de la oferta, previo informe de función pública, que puede asignarlas a otros cuerpos del mismo grupo preferentemente."}, {"u": 3, "f": "Reservas en la oferta de la AGE", "b": "Promoción interna ≥ 30 % de las plazas de acceso libre · discapacidad ≥ 10 %, con ≥ 2 % para discapacidad intelectual (art. 108.3 y 108.4)."}, {"u": 3, "f": "El 7 % del art. 59 TREBEP", "b": "Sigue vigente como mínimo básico para todas las Administraciones (2 % intelectual). El 10 % es una mejora solo para la Administración del Estado."}, {"u": 3, "f": "Aprobación de la oferta de la AGE", "b": "Real decreto del Gobierno, a propuesta del ministerio de función pública, con informe favorable de Hacienda."}, {"u": 3, "f": "OEP 2026 (Real Decreto 387/2026, de 6 de mayo)", "b": "27.232 plazas: 20.541 libre · 6.345 promoción interna · 346 extraordinaria clima. 2.689 discapacidad (538 intelectual). GACE: 1.255 libre + 450 promoción interna."}, {"u": 3, "f": "Novedades de gestión de la OEP 2026", "b": "Informe de la Dirección General de la Función Pública · diagnóstico si la última convocatoria cubrió menos del 75 % · cronograma orientativo · informe de Presupuestos si se reasignan plazas a grupo superior."}, {"u": 4, "f": "Principios del art. 55.2 TREBEP", "b": "Publicidad · transparencia · imparcialidad y profesionalidad · independencia y discrecionalidad técnica · adecuación pruebas-funciones · agilidad sin perjuicio de la objetividad."}, {"u": 4, "f": "Modelo de selección del art. 112", "b": "Adaptable · mixto (conocimientos y competencias) · social (diversidad territorial). Añade accesibilidad, confidencialidad e igualdad socioeconómica."}, {"u": 4, "f": "Sistemas selectivos de funcionarios", "b": "Oposición y concurso-oposición. Concurso: solo excepcional y por ley (art. 61.6)."}, {"u": 4, "f": "Concurso-oposición (art. 114.7)", "b": "Sucesivo. Fase de concurso proporcionada, nunca decide sola, y solo se valora si se superó la oposición."}, {"u": 4, "f": "Personal laboral fijo (art. 61.7)", "b": "Oposición, concurso-oposición o concurso de valoración de méritos."}, {"u": 4, "f": "Número de aprobados y relación complementaria", "b": "No más aprobados que plazas salvo previsión de la convocatoria. Si se propusieron tantos como plazas y hay renuncias antes del nombramiento o la toma de posesión: relación complementaria."}, {"u": 4, "f": "Curso selectivo (art. 114.8)", "b": "Periodo formativo o de prácticas evaluable; se es funcionario en prácticas."}, {"u": 4, "f": "Discapacidad intelectual (art. 113.3)", "b": "Grado ≥ 33 %; pruebas selectivas específicas e independientes."}, {"u": 5, "f": "Convocatoria (RD 364/1995)", "b": "La convoca el subsecretario con informe favorable de la Dirección General de la Función Pública; bases en el BOE; vinculan a todos; sorteo único anual del orden de actuación."}, {"u": 5, "f": "Solicitudes y admitidos", "b": "Solicitudes: 20 días naturales · lista de admitidos en máximo 1 mes · subsanación: 10 días hábiles."}, {"u": 5, "f": "Entre ejercicios y anuncios", "b": "Mínimo 72 horas y máximo 45 días naturales · anuncios: 12 h (mismo ejercicio) o 24 h (nuevo)."}, {"u": 5, "f": "Documentación de aprobados (art. 23)", "b": "20 días naturales desde la publicación de la relación definitiva. Si no se presenta: no hay nombramiento y se anulan las actuaciones."}, {"u": 5, "f": "Nombramiento (art. 25)", "b": "Por la Secretaría de Estado de Función Pública, en el BOE. Nombrar más que plazas: nulo de pleno derecho."}, {"u": 5, "f": "Destino inicial (art. 26)", "b": "Según el orden obtenido; carácter definitivo, equivalente al obtenido por concurso."}, {"u": 5, "f": "Toma de posesión (art. 114.12)", "b": "15 días naturales desde la publicación del nombramiento; 1 mes si hay cambio de localidad de residencia. Interinos y eventuales: al día siguiente."}, {"u": 6, "f": "Exclusiones de los órganos de selección", "b": "Art. 60.2 TREBEP: elección o designación política, interinos, eventuales. Art. 115.2: además altos cargos y laborales no fijos. Art. 13.2 RD 364/1995: preparadores en los 5 años anteriores."}, {"u": 6, "f": "Tribunales (art. 11 RD 364/1995)", "b": "En cada convocatoria · número impar · funcionarios de carrera · no menos de 5 · igual número de suplentes · titulación igual o superior."}, {"u": 6, "f": "Comisión Permanente de Selección", "b": "Orden HFP/266/2023, de 12 de marzo: presidente + 45 vocales + secretario. Preside el titular de la Subdirección de Selección del INAP. Cuerpos: Gestión, Sistemas, Administrativo, Técnicos Auxiliares de Informática, Auxiliar."}, {"u": 6, "f": "Otras reglas del art. 13 RD 364/1995", "b": "No mayoritariamente del mismo cuerpo que se selecciona · asesores especialistas · abstención y recusación."}, {"u": 6, "f": "Órganos de selección de personal laboral", "b": "Número impar; uno a propuesta de los trabajadores; puede formar parte el laboral fijo, no el eventual, el interino ni el de designación política."}, {"u": 7, "f": "Gobierno", "b": "Dirige la política de personal · aprueba la oferta · valida acuerdos de la Mesa General · fija retribuciones · máximo de eventuales · separación del servicio."}, {"u": 7, "f": "Secretaría de Estado de Función Pública", "b": "Nombra funcionarios de carrera · aprueba plan general, de reestructuración y de empleo · concursos unitarios · propone la oferta · de ella dependen la DGFP y el INAP."}, {"u": 7, "f": "Ministros y secretarios de Estado (RD 2169/1984, art. 9)", "b": "Libre designación · convocar y resolver concursos · potestad disciplinaria salvo separación · propuesta de RPT · nombramiento de eventuales."}, {"u": 7, "f": "Subsecretarios", "b": "Jefatura superior del personal · convocar y resolver pruebas selectivas (examen 2019) · incoar expedientes y sancionar faltas leves · servicios especiales."}, {"u": 7, "f": "Posesión y cese (RD 2169/1984, art. 11)", "b": "Subsecretario en servicios centrales · delegado del Gobierno en periféricos. También jubilaciones, permisos y trienios."}, {"u": 8, "f": "Introducción de función pública: las cuatro piezas", "b": "Arts. 103.3 y 149.1.18.ª CE · RDLeg 5/2015 «(en adelante, TREBEP)» · Ley 30/1984 y reglamentos en lo que no se opongan · para este tema: libro II del Real Decreto-ley 6/2023 y RD 364/1995."}, {"u": 8, "f": "Calificación previa del Tema 3", "b": "«Con carácter previo, procede calificar el proceso»: turno (libre, promoción interna, reserva) · oferta de la que procede · fase · órgano que dictó el acto."}, {"u": 8, "f": "Mini-supuesto: plazas no cubiertas", "b": "Oferta de 12/07/2023 → límite 12/07/2026. Convocatoria de 04/09/2026: no pueden incluirse."}, {"u": 8, "f": "Mini-supuesto: toma de posesión", "b": "Publicación el 02/11/2026: 15 días → 17/11/2026; con cambio de residencia, 1 mes → 02/12/2026."}, {"u": 8, "f": "Conclusión afirmativa tipo", "b": "«Por tanto, se concluye que la composición del tribunal es contraria a Derecho y que debe designarse un tribunal de al menos cinco funcionarios de carrera antes del primer ejercicio.»"}];
const UNAMES={"1": "Planificación", "2": "RPT y registros", "3": "Oferta de empleo", "4": "Principios y sistemas", "5": "Procedimiento", "6": "Órganos de selección", "7": "Competencias", "8": "Supuesto"};
const SK="gace27_bv_t03_fc_v1";
let db=(()=>{try{const r=localStorage.getItem(SK);return r?JSON.parse(r):{}}catch(e){return{}}})();
function save(){try{localStorage.setItem(SK,JSON.stringify(db))}catch(e){}}
function r(i){return db[i]||{ok:0,ko:0,last:null}}
let st={unit:0,mode:"all",order:[],pos:0,flipped:false};
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function build(){
  let ids=CARDS.map((c,i)=>i).filter(i=>st.unit===0||CARDS[i].u===st.unit);
  if(st.mode==="pend")ids=ids.filter(i=>r(i).last!=="ok");
  st.order=shuffle(ids);st.pos=0;st.flipped=false;
}
function renderNav(){
  const t=[{v:0,l:"Todo el tema"},...Object.keys(UNAMES).map(k=>({v:+k,l:UNAMES[k]}))];
  document.getElementById("nav").innerHTML=t.map(x=>`<button class="nb${st.unit===x.v?" active":""}" onclick="setUnit(${x.v})">${x.l}</button>`).join("");
}
function renderStats(){
  const ids=CARDS.map((c,i)=>i).filter(i=>st.unit===0||CARDS[i].u===st.unit);
  const ok=ids.filter(i=>r(i).last==="ok").length, ko=ids.filter(i=>r(i).last==="ko").length;
  document.getElementById("stats").innerHTML=`<div class="stat"><div class="stat-n" style="color:#0f6e56">${ok}</div><div class="stat-l">Sabidas</div></div><div class="stat"><div class="stat-n" style="color:#a32d2d">${ko}</div><div class="stat-l">Por repasar</div></div><div class="stat"><div class="stat-n">${ids.length-ok-ko}</div><div class="stat-l">Sin ver</div></div>`;
}
function renderCtrl(){
  document.getElementById("ctrl").innerHTML=`<button class="btn${st.mode==="all"?" active":""}" onclick="setMode('all')">Todas</button><button class="btn${st.mode==="pend"?" active":""}" onclick="setMode('pend')">Solo pendientes</button><button class="btn" onclick="build();render()">🔀 Barajar</button><button class="btn danger" style="margin-left:auto" onclick="resetAll(this)">Reiniciar progreso</button>`;
}
function resetAll(b){
  if(b.dataset.armed){db={};save();build();renderAll();return}
  b.dataset.armed="1";b.textContent="Pulsa otra vez para borrar";
  setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent="Reiniciar progreso"}},3000);
}
function render(){
  renderStats();
  const s=document.getElementById("stage");
  if(!st.order.length){s.innerHTML=`<div class="empty">${st.mode==="pend"?"No te queda ninguna pendiente en este bloque. Pulsa «Todas» para repasar el mazo completo.":"No hay tarjetas en este bloque."}</div>`;return}
  if(st.pos>=st.order.length){s.innerHTML=`<div class="empty">Ronda terminada.<br><br><button class="btn active" onclick="build();render()">Empezar otra ronda</button></div>`;return}
  const i=st.order[st.pos],c=CARDS[i];
  s.innerHTML=`<div class="card${st.flipped?" back-side":""}" tabindex="0" role="button" aria-label="Girar tarjeta" onclick="flip()" onkeydown="if(event.key==='Enter'){flip()}">
    <div class="meta"><span>${UNAMES[c.u]}</span><span>${st.pos+1} / ${st.order.length}</span></div>
    <div class="face">${st.flipped?c.b:c.f}</div>
    <div class="hint">${st.flipped?"¿La sabías?":"Toca la tarjeta o pulsa espacio para ver la respuesta"}</div></div>
    <div class="answer"><button class="no" ${st.flipped?"":"disabled"} onclick="mark('ko')">✗ No la sabía</button><button class="si" ${st.flipped?"":"disabled"} onclick="mark('ok')">✓ La sabía</button></div>
    <div class="dots">${st.order.map((id,k)=>`<span class="dot ${r(id).last==="ok"?"ok":r(id).last==="ko"?"ko":""}${k===st.pos?" cur":""}"></span>`).join("")}</div>`;
}
function flip(){st.flipped=!st.flipped;render()}
function mark(v){const i=st.order[st.pos],x=r(i);x[v]++;x.last=v;db[i]=x;save();if(v==="ko")st.order.push(i);st.pos++;st.flipped=false;render()}
function setUnit(u){st.unit=u;build();renderAll()}
function setMode(m){st.mode=m;build();renderAll()}
function renderAll(){renderNav();renderCtrl();render()}
document.addEventListener("keydown",e=>{if(e.target.tagName==="BUTTON")return;if(e.code==="Space"){e.preventDefault();flip()}else if(st.flipped&&e.key==="ArrowRight")mark("ok");else if(st.flipped&&e.key==="ArrowLeft")mark("ko")});
build();renderAll();
</script>
</body>
</html>
