<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GACE 2027 · Bloque IV · Tema 3 · Flashcards</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f4;color:#1a1a18;min-height:100vh;padding:1rem}
.wrap{max-width:680px;margin:0 auto}
.back{display:inline-block;font-size:12px;color:#185fa5;text-decoration:none;margin-bottom:.6rem}
h1{font-size:17px;font-weight:600;margin-bottom:1rem}
.nav{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:.7rem}
.nb{padding:5px 12px;border:1px solid #d3d1c7;border-radius:8px;background:#fff;color:#5f5e5a;font-size:13px;cursor:pointer}
.nb.active{background:#e6f1fb;color:#185fa5;border-color:#185fa5}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:.7rem}
.stat{background:#fff;border:1px solid #d3d1c7;border-radius:8px;padding:.55rem;text-align:center}
.stat-n{font-size:19px;font-weight:600}.stat-l{font-size:11px;color:#888780}
.ctrl{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:.9rem}
.btn{padding:6px 13px;border:1px solid #d3d1c7;border-radius:8px;background:#fff;color:#1a1a18;font-size:13px;cursor:pointer}
.btn.active{background:#e6f1fb;color:#185fa5;border-color:#185fa5}
.btn.danger{background:#fcebeb;color:#a32d2d;border-color:#f7c1c1}
.card{background:#fff;border:1.5px solid #d3d1c7;border-radius:14px;min-height:260px;padding:22px 22px 18px;cursor:pointer;display:flex;flex-direction:column;user-select:none}
.card:focus-visible{outline:3px solid #185fa5;outline-offset:2px}
.card.back-side{border-color:#185fa5;background:#fbfdff}
.meta{display:flex;justify-content:space-between;font-size:11px;color:#888780;margin-bottom:12px}
.face{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;font-size:17px;line-height:1.55;white-space:pre-line}
.back-side .face{font-size:15px;text-align:left;justify-content:flex-start;align-items:flex-start}
.hint{font-size:11px;color:#b4b2a9;text-align:center;margin-top:12px}
.answer{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.answer button{padding:12px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;border:1.5px solid}
.no{background:#fcebeb;color:#a32d2d;border-color:#f7c1c1}
.si{background:#eaf3de;color:#0f6e56;border-color:#a6d9b8}
.answer button:disabled{opacity:.4;cursor:default}
.dots{display:flex;gap:3px;flex-wrap:wrap;margin-top:14px}
.dot{width:9px;height:9px;border-radius:2px;background:#e4e2db}
.dot.ok{background:#1d9e75}.dot.ko{background:#e24b4a}.dot.cur{outline:2px solid #185fa5}
.empty{color:#888780;font-size:14px;padding:3rem;text-align:center;background:#fff;border-radius:12px;border:1px solid #d3d1c7}
</style>
</head>
<body>
<div class="wrap">
<a class="back" href="../index.html">← Portal de Estudio</a>
<h1>🃏 GACE 2027 · Bloque IV · Tema 3 · Flashcards</h1>
<div class="nav" id="nav"></div>
<div class="stats" id="stats"></div>
<div class="ctrl" id="ctrl"></div>
<div id="stage"></div>
</div>
<script>
const CARDS=[{"u": 1, "f": "Concepto de reglamento (temario 2026)", "b": "Toda disposición de carácter general, escrita, dictada por la Administración en ejercicio de una potestad propia (potestad reglamentaria), con rango inferior a la ley."}, {"u": 1, "f": "Las tres notas del reglamento", "b": "1) Norma: innova y se integra en el ordenamiento; no se agota.\n2) Procede de la Administración: legitimidad democrática indirecta, subordinado a la ley.\n3) Control judicial pleno: anulación (106.1 CE) e inaplicación (6 LOPJ)."}, {"u": 1, "f": "Titulares de la potestad reglamentaria", "b": "Gobierno (97 CE) · ministros en las materias de su departamento (4.1.b Ley 50/1997) · Consejos de Gobierno autonómicos (Estatutos) · Entidades Locales (4.1.a LRBRL) · otros órganos solo con atribución legal expresa (autoridades independientes, Banco de España)."}, {"u": 1, "f": "Consunción frente a ordinamentalidad", "b": "Consunción: se agota con su cumplimiento → acto (aunque tenga muchos destinatarios, p. ej. una convocatoria).\nOrdinamentalidad: se integra en el ordenamiento para casos futuros indeterminados → reglamento."}, {"u": 1, "f": "Reglamento frente a acto: invalidez y recursos", "b": "Reglamento: siempre nulo de pleno derecho (47.2 L39); sin recurso administrativo (112.3); directo al contencioso.\nActo: nulo (47.1) o anulable (48); recursos administrativos y contencioso."}, {"u": 1, "f": "Reglamento frente a acto: derogación y publicidad", "b": "Reglamento: se deroga libremente por otro; se publica para entrar en vigor.\nActo: revocación limitada en los de gravamen; los favorables solo por revisión; se notifica o publica."}, {"u": 1, "f": "Los bandos del Alcalde", "b": "Art. 21.1.e LRBRL. Por regla general recuerdan o comunican normas, sin contenido normativo propio. Solo en catástrofe o infortunio público (21.1.m) pueden imponer medidas nuevas."}, {"u": 2, "f": "Reglamentos ejecutivos", "b": "Desarrollan o complementan una ley. Dictamen preceptivo del Consejo de Estado, también para sus modificaciones (22.3 LO 3/1980)."}, {"u": 2, "f": "Reglamentos independientes", "b": "Materias no reguladas por ley ni reservadas. En el Estado, fundamentalmente organizativos o domésticos. Nunca afectan a derechos. Sin dictamen del Consejo de Estado."}, {"u": 2, "f": "Reglamentos de necesidad", "b": "Para emergencias (alarma, crisis sanitaria, catástrofe), en virtud de una habilitación legal (p. ej. LO 4/1981). Vigencia limitada a la emergencia."}, {"u": 2, "f": "Ad extra frente a ad intra", "b": "Jurídicos o normativos (ad extra): afectan a los ciudadanos; requieren habilitación legal.\nOrganizativos (ad intra): organización interna y relaciones de sujeción especial."}, {"u": 2, "f": "Las seis formas de las decisiones del Gobierno (art. 25 Ley 50/1997)", "b": "1) RD legislativos y RD-leyes · 2) RD del Presidente · 3) RD acordados en Consejo de Ministros · 4) Acuerdos del Consejo de Ministros · 5) Acuerdos de Comisiones Delegadas · 6) Órdenes ministeriales."}, {"u": 2, "f": "Orden que afecta a varios departamentos", "b": "Orden del Ministro de la Presidencia, dictada a propuesta de los ministros interesados (art. 25.f Ley 50/1997)."}, {"u": 2, "f": "Jerarquía reglamentaria estatal (art. 24.2 Ley 50/1997)", "b": "1.º RD del Presidente o acordado en Consejo de Ministros (mismo nivel).\n2.º Órdenes ministeriales.\nNingún reglamento vulnera otro de jerarquía superior. El acuerdo del Consejo de Ministros no es reglamento."}, {"u": 3, "f": "Límites formales", "b": "Competencia del órgano · procedimiento de elaboración · jerarquía normativa · publicación."}, {"u": 3, "f": "Límites materiales", "b": "Constitución y leyes · reserva de ley · irretroactividad sancionadora desfavorable (9.3 CE) · principios generales (interdicción de la arbitrariedad) · inderogabilidad singular · distribución de competencias."}, {"u": 3, "f": "Art. 128.2 Ley 39/2015 (literal clave)", "b": "No vulnerar la CE o las leyes ni regular materias de las Cortes o Asambleas. Sin perjuicio de su colaboración con la ley, no tipificar delitos, faltas o infracciones, ni establecer penas o sanciones, tributos, exacciones parafiscales u otras cargas o prestaciones personales o patrimoniales públicas."}, {"u": 3, "f": "Art. 37 Ley 39/2015 (literal)", "b": "37.1: las resoluciones particulares no pueden vulnerar una disposición general, aunque procedan de un órgano de igual o superior JERARQUÍA al que la dictó.\n37.2: son nulas, igual que las que incurran en causa del art. 47."}, {"u": 3, "f": "Seis principios de buena regulación (art. 129)", "b": "Necesidad · eficacia · proporcionalidad · seguridad jurídica · transparencia · eficiencia. Se justifican en el preámbulo."}, {"u": 3, "f": "Las nueve fases del procedimiento estatal", "b": "1) Plan Anual Normativo · 2) consulta pública previa · 3) redacción + MAIN · 4) audiencia e información pública · 5) informes (SGT siempre) · 6) Consejo de Estado si es ejecutivo · 7) Comisión de Subsecretarios → Consejo de Ministros · 8) publicación · 9) evaluación."}, {"u": 3, "f": "Audiencia e información pública: plazo", "b": "Mínimo 15 días hábiles, reducible a 7 por razones debidamente motivadas (art. 26.6 Ley 50/1997)."}, {"u": 3, "f": "Tramitación urgente (art. 27 Ley 50/1997)", "b": "La acuerda el Consejo de Ministros. Plazos a la mitad · sin consulta pública previa · audiencia de 7 días · la falta de informe o dictamen en plazo no impide continuar."}, {"u": 3, "f": "Art. 23 Ley 50/1997", "b": "Reglamentos que imponen nuevas obligaciones a actividades económicas o profesionales: en vigor el 2 de enero o el 1 de julio siguientes. Excepciones: RD-leyes, transposición de directivas u otras razones acreditadas en la MAIN."}, {"u": 3, "f": "Artículos del procedimiento: qué regula cada uno", "b": "129 buena regulación · 130 y 28 evaluación · 131 y 23 publicación y vigencia · 132 y 25 planificación · 133 y 26 participación y procedimiento (Ley 39/2015 y Ley 50/1997)."}, {"u": 3, "f": "STC 55/2018", "b": "Varias previsiones del Título VI de la Ley 39/2015 no se aplican a la potestad legislativa autonómica; algunas solo rigen para el Estado. Siguen aplicándose a la AGE."}, {"u": 4, "f": "Las seis vías de control del reglamento", "b": "1) Recurso directo (2 meses) · 2) indirecto contra actos de aplicación · 3) cuestión de ilegalidad · 4) inaplicación judicial (6 LOPJ) · 5) revisión de oficio (106.2) · 6) TC: conflicto de competencias, amparo, 161.2 CE."}, {"u": 4, "f": "Cuestión de ilegalidad (arts. 27 y 123-126 LJCA)", "b": "Tras sentencia firme estimatoria de un recurso indirecto, si el juez no es competente para el directo; en los 5 días siguientes a la firmeza. Si es competente, declara validez o nulidad (27.2). El TS anula sin cuestión (27.3)."}, {"u": 4, "f": "Revisión de oficio de disposiciones (art. 106.2)", "b": "De oficio, en cualquier momento, previo dictamen favorable del Consejo de Estado u órgano autonómico. Caduca a los 6 meses (106.5)."}, {"u": 4, "f": "STS 1598/2022, de 30 de noviembre", "b": "El particular no tiene acción para obtener la nulidad de un reglamento por revisión de oficio: la facultad es exclusiva de la Administración autora. Su vía: recurso directo o indirecto."}, {"u": 4, "f": "Efectos de la anulación (72.2 y 73 LJCA)", "b": "Efectos generales desde la publicación del fallo. No afecta por sí a actos y sentencias firmes anteriores, salvo exclusión o reducción de sanciones no ejecutadas."}, {"u": 4, "f": "Recurso contra un acto fundado solo en la nulidad del reglamento", "b": "Se interpone directamente ante el órgano que dictó el reglamento (art. 112.3 Ley 39/2015, último inciso)."}, {"u": 5, "f": "Principios generales: concepto y triple función", "b": "Criterios básicos que inspiran el ordenamiento y expresan los valores de la comunidad. Art. 1.4 CC: supletorios en defecto de ley o costumbre, informadores y, por ello, interpretativos."}, {"u": 5, "f": "Por qué pesan en Derecho administrativo", "b": "La legislación no lo prevé todo y permiten controlar la discrecionalidad. Positivizados (9.3 y 103.1 CE, art. 3 Ley 40/2015) tienen rango constitucional o legal."}, {"u": 5, "f": "Confianza legítima", "b": "Protege la confianza en la estabilidad de las decisiones cuando la Administración ha creado signos externos. Origen alemán y de la UE. Art. 3.1.e Ley 40/2015."}, {"u": 5, "f": "Buena fe", "b": "Lealtad; prohíbe ir contra los propios actos y el abuso del derecho. Art. 7 CC y 3.1.e Ley 40/2015."}, {"u": 5, "f": "Proporcionalidad (art. 4 Ley 40/2015)", "b": "Medida adecuada, necesaria y proporcionada en sentido estricto. Si se exigen requisitos o se limitan derechos, la menos restrictiva."}, {"u": 5, "f": "Los once principios del art. 3.1 Ley 40/2015 (1-6)", "b": "a) Servicio efectivo · b) simplicidad, claridad y proximidad · c) participación, objetividad y transparencia · d) racionalización y agilidad · e) buena fe, confianza legítima y lealtad institucional · f) responsabilidad por la gestión pública."}, {"u": 5, "f": "Los once principios del art. 3.1 Ley 40/2015 (7-11)", "b": "g) Planificación y dirección por objetivos, control y evaluación (examen 2019) · h) eficacia · i) economía, suficiencia y adecuación de medios · j) eficiencia · k) cooperación, colaboración y coordinación."}, {"u": 6, "f": "Tratado (art. 2 Ley 25/2014)", "b": "Acuerdo celebrado por escrito entre España y otro u otros sujetos de Derecho internacional, regido por el Derecho internacional, cualquiera que sea su denominación."}, {"u": 6, "f": "Acuerdo administrativo frente a no normativo", "b": "Administrativo: lo celebran órganos de la Administración en ejecución o concreción de un tratado.\nNo normativo: no genera obligaciones internacionales ni se rige por el Derecho internacional (memorandos)."}, {"u": 6, "f": "Fases de celebración", "b": "Negociación · adopción y autenticación · firma (autoriza el Consejo de Ministros) · autorización de las Cortes si procede · consentimiento (Rey: ratificación, adhesión, aceptación) · publicación."}, {"u": 6, "f": "CCAA y tratados (Ley 25/2014, arts. 49-52)", "b": "Solicitar al Gobierno la apertura de negociaciones (examen 2019) · información · participación en la delegación · ejecución · acuerdos administrativos y no normativos previo informe de Asuntos Exteriores."}, {"u": 6, "f": "Art. 94.1 CE: cinco tipos", "b": "Políticos · militares · integridad territorial o derechos y deberes del Título I · obligaciones financieras para la Hacienda · modificación o derogación de ley o medidas legislativas. Desacuerdo: Comisión Mixta y Congreso por mayoría absoluta (74.2)."}, {"u": 6, "f": "Art. 95 CE", "b": "Tratado contrario a la CE: previa revisión constitucional. Requerimiento al TC: Gobierno o cualquiera de las Cámaras (78 LOTC). DTC 1/1992 (Maastricht → 13.2) y DTC 1/2004."}, {"u": 6, "f": "Consejo de Estado y tratados", "b": "Comisión Permanente: dictamen sobre la necesidad de autorización de las Cortes antes del consentimiento (22.1 LO 3/1980)."}, {"u": 6, "f": "Eficacia de los tratados", "b": "Incorporación con la publicación (96.1 CE, 1.5 CC) · resistencia (96.1) · denuncia por el mismo procedimiento (96.2) · prevalencia salvo sobre la CE (31 Ley 25/2014) · valor interpretativo (10.2 CE)."}, {"u": 6, "f": "STC 140/2018", "b": "Conflicto tratado–ley: no es de constitucionalidad sino de selección del Derecho aplicable; lo resuelve el juez ordinario (control de convencionalidad)."}, {"u": 7, "f": "Introducción de potestad reglamentaria: las cuatro piezas", "b": "1) Constitución: 97, 9.3, 106.1 y 149.1.18.ª.\n2) LPAC (Ley 39/2015): Título VI (127 a 133) y 47.2.\n3) Ley 50/1997 del Gobierno: arts. 24 a 26.\n4) Control: LJCA (Ley 29/1998), arts. 25 a 27."}, {"u": 7, "f": "Calificación previa ante una orden o un real decreto", "b": "¿Disposición general o acto? · forma y órgano (24 y 25 Ley 50/1997) · ¿ejecutivo o independiente? · ¿efectos ad extra o ad intra? → de ello dependen el dictamen del Consejo de Estado, la invalidez y la vía."}, {"u": 7, "f": "Órgano judicial del recurso directo", "b": "Orden ministerial → Audiencia Nacional (11.1.a LJCA).\nReal decreto del Consejo de Ministros → Tribunal Supremo (12.1.a)."}, {"u": 7, "f": "Mini-supuesto: orden ejecutiva sin dictamen y con 5 días de audiencia", "b": "Nula de pleno derecho (47.2): falta el dictamen preceptivo (22.3 LO 3/1980) y la audiencia es inferior al mínimo de 15 (o 7) días. Directo ante la AN en 2 meses; alzada contra la sanción en 1 mes."}];
const UNAMES={"1": "Concepto y acto", "2": "Clases y jerarquía", "3": "Límites y procedimiento", "4": "Control", "5": "Principios generales", "6": "Tratados", "7": "Supuesto"};
const SK="gace27_biv_t03_fc_v1";
let db=(()=>{try{const r=localStorage.getItem(SK);return r?JSON.parse(r):{}}catch(e){return{}}})();
function save(){try{localStorage.setItem(SK,JSON.stringify(db))}catch(e){}}
function r(i){return db[i]||{ok:0,ko:0,last:null}}
let st={unit:0,mode:"all",order:[],pos:0,flipped:false};
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function build(){
  let ids=CARDS.map((c,i)=>i).filter(i=>st.unit===0||CARDS[i].u===st.unit);
  if(st.mode==="pend")ids=ids.filter(i=>r(i).last!=="ok");
  st.order=shuffle(ids);st.pos=0;st.flipped=false;
}
function renderNav(){
  const t=[{v:0,l:"Todo el tema"},...Object.keys(UNAMES).map(k=>({v:+k,l:UNAMES[k]}))];
  document.getElementById("nav").innerHTML=t.map(x=>`<button class="nb${st.unit===x.v?" active":""}" onclick="setUnit(${x.v})">${x.l}</button>`).join("");
}
function renderStats(){
  const ids=CARDS.map((c,i)=>i).filter(i=>st.unit===0||CARDS[i].u===st.unit);
  const ok=ids.filter(i=>r(i).last==="ok").length, ko=ids.filter(i=>r(i).last==="ko").length;
  document.getElementById("stats").innerHTML=`<div class="stat"><div class="stat-n" style="color:#0f6e56">${ok}</div><div class="stat-l">Sabidas</div></div><div class="stat"><div class="stat-n" style="color:#a32d2d">${ko}</div><div class="stat-l">Por repasar</div></div><div class="stat"><div class="stat-n">${ids.length-ok-ko}</div><div class="stat-l">Sin ver</div></div>`;
}
function renderCtrl(){
  document.getElementById("ctrl").innerHTML=`<button class="btn${st.mode==="all"?" active":""}" onclick="setMode('all')">Todas</button><button class="btn${st.mode==="pend"?" active":""}" onclick="setMode('pend')">Solo pendientes</button><button class="btn" onclick="build();render()">🔀 Barajar</button><button class="btn danger" style="margin-left:auto" onclick="resetAll(this)">Reiniciar progreso</button>`;
}
function resetAll(b){
  if(b.dataset.armed){db={};save();build();renderAll();return}
  b.dataset.armed="1";b.textContent="Pulsa otra vez para borrar";
  setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent="Reiniciar progreso"}},3000);
}
function render(){
  renderStats();
  const s=document.getElementById("stage");
  if(!st.order.length){s.innerHTML=`<div class="empty">${st.mode==="pend"?"No te queda ninguna pendiente en este bloque. Pulsa «Todas» para repasar el mazo completo.":"No hay tarjetas en este bloque."}</div>`;return}
  if(st.pos>=st.order.length){s.innerHTML=`<div class="empty">Ronda terminada.<br><br><button class="btn active" onclick="build();render()">Empezar otra ronda</button></div>`;return}
  const i=st.order[st.pos],c=CARDS[i];
  s.innerHTML=`<div class="card${st.flipped?" back-side":""}" tabindex="0" role="button" aria-label="Girar tarjeta" onclick="flip()" onkeydown="if(event.key==='Enter'){flip()}">
    <div class="meta"><span>${UNAMES[c.u]}</span><span>${st.pos+1} / ${st.order.length}</span></div>
    <div class="face">${st.flipped?c.b:c.f}</div>
    <div class="hint">${st.flipped?"¿La sabías?":"Toca la tarjeta o pulsa espacio para ver la respuesta"}</div></div>
    <div class="answer"><button class="no" ${st.flipped?"":"disabled"} onclick="mark('ko')">✗ No la sabía</button><button class="si" ${st.flipped?"":"disabled"} onclick="mark('ok')">✓ La sabía</button></div>
    <div class="dots">${st.order.map((id,k)=>`<span class="dot ${r(id).last==="ok"?"ok":r(id).last==="ko"?"ko":""}${k===st.pos?" cur":""}"></span>`).join("")}</div>`;
}
function flip(){st.flipped=!st.flipped;render()}
function mark(v){const i=st.order[st.pos],x=r(i);x[v]++;x.last=v;db[i]=x;save();if(v==="ko")st.order.push(i);st.pos++;st.flipped=false;render()}
function setUnit(u){st.unit=u;build();renderAll()}
function setMode(m){st.mode=m;build();renderAll()}
function renderAll(){renderNav();renderCtrl();render()}
document.addEventListener("keydown",e=>{if(e.target.tagName==="BUTTON")return;if(e.code==="Space"){e.preventDefault();flip()}else if(st.flipped&&e.key==="ArrowRight")mark("ok");else if(st.flipped&&e.key==="ArrowLeft")mark("ko")});
build();renderAll();
</script>
</body>
</html>
