<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f4;color:#1a1a18;min-height:100vh;padding:1rem}
.wrap{max-width:680px;margin:0 auto}
.back{display:inline-block;font-size:12px;color:#185fa5;text-decoration:none;margin-bottom:.6rem}
h1{font-size:17px;font-weight:600;margin-bottom:1rem}
.nav{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:.7rem}
.nb{padding:5px 12px;border:1px solid #d3d1c7;border-radius:8px;background:#fff;color:#5f5e5a;font-size:13px;cursor:pointer}
.nb.active{background:#e6f1fb;color:#185fa5;border-color:#185fa5}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:.7rem}
.stat{background:#fff;border:1px solid #d3d1c7;border-radius:8px;padding:.55rem;text-align:center}
.stat-n{font-size:19px;font-weight:600}.stat-l{font-size:11px;color:#888780}
.ctrl{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:.9rem}
.btn{padding:6px 13px;border:1px solid #d3d1c7;border-radius:8px;background:#fff;color:#1a1a18;font-size:13px;cursor:pointer}
.btn.active{background:#e6f1fb;color:#185fa5;border-color:#185fa5}
.btn.danger{background:#fcebeb;color:#a32d2d;border-color:#f7c1c1}
.card{background:#fff;border:1.5px solid #d3d1c7;border-radius:14px;min-height:260px;padding:22px 22px 18px;cursor:pointer;display:flex;flex-direction:column;user-select:none}
.card:focus-visible{outline:3px solid #185fa5;outline-offset:2px}
.card.back-side{border-color:#185fa5;background:#fbfdff}
.meta{display:flex;justify-content:space-between;font-size:11px;color:#888780;margin-bottom:12px}
.face{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;font-size:17px;line-height:1.55;white-space:pre-line}
.back-side .face{font-size:15px;text-align:left;justify-content:flex-start;align-items:flex-start}
.hint{font-size:11px;color:#b4b2a9;text-align:center;margin-top:12px}
.answer{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.answer button{padding:12px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;border:1.5px solid}
.no{background:#fcebeb;color:#a32d2d;border-color:#f7c1c1}
.si{background:#eaf3de;color:#0f6e56;border-color:#a6d9b8}
.answer button:disabled{opacity:.4;cursor:default}
.dots{display:flex;gap:3px;flex-wrap:wrap;margin-top:14px}
.dot{width:9px;height:9px;border-radius:2px;background:#e4e2db}
.dot.ok{background:#1d9e75}.dot.ko{background:#e24b4a}.dot.cur{outline:2px solid #185fa5}
.empty{color:#888780;font-size:14px;padding:3rem;text-align:center;background:#fff;border-radius:12px;border:1px solid #d3d1c7}
</style>

<script>
const CARDS=[{"u": 1, "f": "Los seis tipos del art. 12", "b": "Obras (13) · concesión de obras (14) · concesión de servicios (15) · suministro (16) · servicios (17) · mixtos (18). No son contratos: encargos a medios propios (32-33) y convenios (6)."}, {"u": 1, "f": "Qué decide el tipo de contrato", "b": "Umbral armonizado y DOUE (19-23) · contrato menor y simplificados (118, 159) · duración (29) · clasificación (77) · recurso especial (44) · revisión de precios (103) · reglas propias de preparación, ejecución, modificación y extinción."}, {"u": 1, "f": "Cambios de la Ley 9/2017 en la tipología", "b": "Desaparecen la gestión de servicios públicos (concesión, gestión interesada, concierto, sociedad mixta) y el contrato de colaboración público-privada · el riesgo operacional define las concesiones · encomiendas → encargos a medios propios."}, {"u": 1, "f": "Riesgo operacional (art. 14.4)", "b": "De demanda, de suministro o ambos. Existe si no está garantizado recuperar inversiones ni cubrir costes en condiciones normales. Exposición real al mercado: pérdida no meramente nominal o desdeñable. Si la Administración garantiza la inversión, no hay concesión."}, {"u": 1, "f": "Concesión de servicios o contrato de servicios", "b": "Riesgo operacional en el contratista → concesión. Lo retiene la Administración, que paga un precio → contrato de servicios, aunque vaya a la ciudadanía (art. 312)."}, {"u": 1, "f": "Cuadro de umbrales por tipo", "b": "Obras: SARA 5.404.000 · menor < 40.000 · recurso especial > 3 M · clasificación ≥ 500.000.\nConcesiones: SARA 5.404.000 · recurso > 3 M.\nSuministro y servicios: SARA 140.000 (AGE) / 216.000 / 750.000 (anexo IV) · menor < 15.000 · recurso > 100.000."}, {"u": 1, "f": "Reformas 2025-2026 del Tema 6", "b": "Umbrales 2026-2027 (26/12/2025) · DA 57.ª [sic] vivienda, RDL 7/2026 (22/03/2026) · DA 4.ª contratos reservados, Ley 1/2026 · Orden HAC/459/2026 de contratación centralizada (13/05/2026)."}, {"u": 2, "f": "Obra completa (art. 13.3)", "b": "Susceptible de entregarse al uso con todos sus elementos. Caben partes independientes con autorización motivada. Conservación y mantenimiento: sin obra completa. Prohibido fraccionar (99.2), pero la división en lotes es la regla (99.3)."}, {"u": 2, "f": "Clasificación de las obras (art. 232)", "b": "a) Primer establecimiento, reforma, restauración, rehabilitación o gran reparación · b) reparación simple (causas fortuitas) · c) conservación y mantenimiento (uso natural) · d) demolición."}, {"u": 2, "f": "Restauración o rehabilitación", "b": "Restauración: repara conservando estética, valor histórico y la MISMA funcionalidad.\nRehabilitación: repara conservando estética y valor histórico con una NUEVA funcionalidad.\nGran reparación: afecta a la estructura resistente."}, {"u": 2, "f": "Contenido mínimo del proyecto (233)", "b": "Memoria · planos · pliego de prescripciones técnicas particulares · presupuesto con precios unitarios y mediciones · programa de trabajos · referencias del replanteo · estudio de seguridad y salud. + Estudio geotécnico. PBL < 500.000: puede simplificarse."}, {"u": 2, "f": "Presupuesto del proyecto (RGLCAP 131)", "b": "PEM (mediciones × precios) + gastos generales 13-17 % del PEM + beneficio industrial 6 % del PEM + IVA = PBL."}, {"u": 2, "f": "Supervisión del proyecto (art. 235)", "b": "Informe preceptivo antes de aprobar el proyecto si el PBL ≥ 500.000 €, IVA excluido (examen 2019). Por debajo, facultativo, salvo obras que afecten a la estabilidad, seguridad o estanqueidad."}, {"u": 2, "f": "Replanteo del proyecto (art. 236)", "b": "Aprobado el proyecto y antes de aprobar el expediente: realidad geométrica + disponibilidad de terrenos. Dispensa en infraestructuras hidráulicas, de transporte y de carreteras (examen 2024), sin iniciar obras hasta formalizar la ocupación."}, {"u": 2, "f": "Proyecto y obra a la vez (art. 234)", "b": "Excepcional: motivos técnicos que vinculen al empresario a los estudios, o dimensión excepcional o dificultades singulares. Licitación con anteproyecto. Sin acuerdo de precios, el contratista solo cobra el proyecto."}, {"u": 2, "f": "Categorías de clasificación de obras", "b": "1: ≤ 150.000 · 2: ≤ 360.000 · 3: ≤ 840.000 · 4: ≤ 2.400.000 · 5: ≤ 5.000.000 · 6: > 5.000.000 (anualidad media). Exigible desde 500.000 € de valor estimado."}, {"u": 3, "f": "Comprobación del replanteo (art. 237)", "b": "Inicia la ejecución. Plazo del contrato, no superior a 1 mes desde la formalización salvo casos excepcionales. Acta firmada por ambas partes."}, {"u": 3, "f": "Fuerza mayor (art. 239)", "b": "1) Incendios causados por la electricidad atmosférica · 2) fenómenos naturales de efectos catastróficos (maremotos, terremotos, erupciones, movimientos del terreno, temporales marítimos, inundaciones) · 3) destrozos violentos en guerra, robos tumultuosos o alteraciones graves del orden público. Sin imprudencia → indemnización."}, {"u": 3, "f": "Certificaciones (art. 240)", "b": "Mensuales, en los 10 días siguientes al mes. Pagos a cuenta sujetos a la medición final. NO suponen aprobación ni recepción. Abonos a cuenta por operaciones preparatorias, garantizados."}, {"u": 3, "f": "Modificación de obras (art. 242)", "b": "Reducción o supresión de unidades: sin indemnización · precios contradictorios con audiencia mínima de 3 días hábiles · unidades ocultas: aviso a la Intervención con 5 días · no obligatoria si > 20 %."}, {"u": 3, "f": "Lo que NO es modificación en obras (242.4)", "b": "i) Exceso de mediciones ≤ 10 % del precio inicial (va a la certificación final) · ii) precios nuevos que no suban el precio global ni afecten a unidades > 3 % del presupuesto primitivo."}, {"u": 3, "f": "Continuación provisional (242.5)", "b": "Si la modificación exige suspender toda la obra con grave perjuicio: el Ministro puede acordar que continúe, con un máximo del 20 % del precio inicial (IVA excluido) y crédito. Corrección: el temario dice 10 %."}, {"u": 3, "f": "Suspensión (art. 208)", "b": "Acta con causas y situación. Daños tasados: garantía, indemnizaciones laborales y salarios, maquinaria e instalaciones, seguros. Reclamación: prescribe en 1 año desde la orden de reanudar (examen 2019)."}, {"u": 3, "f": "Recepción y certificación final (243)", "b": "Facultativo de la Administración + director facultativo + contratista. Acta → empieza la garantía. Certificación final en 3 meses (5 si > 12 M€ y liquidación compleja). Ocupación sin recepción = efectos de recepción."}, {"u": 3, "f": "Plazo de garantía y liquidación (243.3)", "b": "≥ 1 año salvo casos especiales (sin garantía en sondeos infructuosos y dragados). Informe del director 15 días antes. Favorable: devolución de garantía, liquidación y pago en 60 días."}, {"u": 3, "f": "Vicios ocultos (art. 244)", "b": "Ruina o deterioro grave tras la garantía por incumplimiento del contratista: responde 15 años desde la recepción (también daños estructurales). Acción: 2 años desde que se manifiesta. Pasados 15 años, se extingue."}, {"u": 4, "f": "Causas propias de resolución de obras (245)", "b": "a) Demora injustificada en la comprobación del replanteo · b) suspensión de la iniciación > 4 meses · c) suspensión > 8 meses · d) desistimiento."}, {"u": 4, "f": "Indemnizaciones de la resolución de obras (246)", "b": "Replanteo: 2 % del precio de adjudicación · no iniciar (desistimiento o suspensión > 4 meses): 3 % · desistimiento iniciado o suspensión > 8 meses: 6 % de las obras dejadas de realizar. Siempre IVA excluido y «por todos los conceptos»."}, {"u": 4, "f": "Efectos materiales de la resolución de obras", "b": "Comprobación, medición y liquidación con citación del contratista. Continuación urgente por otro o por la Administración tras notificar la liquidación; impugnable ante el órgano, que resuelve en 15 días."}, {"u": 4, "f": "¿Error del proyecto ≥ 20 % resuelve la obra?", "b": "NO. No está en el art. 245 (error del visual antiguo). El 20 % de desviación es del art. 315: minora el precio del contrato del proyectista."}, {"u": 5, "f": "Estudio de viabilidad de la concesión de obras (247)", "b": "Previo y preceptivo · información pública 1 mes (+1) · informes de otras Administraciones en 1 mes · ONE cuando proceda · sustituible por estudio económico-financiero · se aprueba y publica en el perfil."}, {"u": 5, "f": "Estudio de viabilidad presentado por un particular (247.5)", "b": "Decisión en 3 meses (máx. 6); silencio = no aceptación. Si acaba en concesión: 5 puntos porcentuales adicionales. Si no es adjudicatario: gastos + 5 %."}, {"u": 5, "f": "¿Estudio de viabilidad vinculante?", "b": "Solo en la concesión de SERVICIOS, si concluye la inviabilidad (285.2). En la de obras, el art. 247 no lo dice."}, {"u": 5, "f": "Derechos y obligaciones del concesionario de obras", "b": "Derechos (257): explotar y cobrar, equilibrio, dominio público, expropiaciones, ceder e hipotecar. Obligaciones (258-259): ejecutar, explotar con continuidad, admitir a todo usuario, buen orden, daños a terceros, proteger el dominio público."}, {"u": 5, "f": "Tarifas y retribución", "b": "Prestaciones patrimoniales de carácter público no tributario · máximas · peaje en sombra (la Administración paga por uso) · zonas comerciales · aportaciones públicas."}, {"u": 5, "f": "Equilibrio económico: SÍ (270 y 290)", "b": "a) Modificación por la Administración (ius variandi) · b) actuación obligatoria de la Administración CONCEDENTE (factum principis) · fuera de ellos, SOLO fuerza mayor (239). Plazo: +15 % (en obras, si > 50 % de tarifas)."}, {"u": 5, "f": "Equilibrio económico: NO", "b": "Fallo de previsiones de demanda · crisis económica general · riesgos asumidos en la oferta · acuerdos sin trascendencia económica · disposición de OTRA Administración (solo da derecho a desistir)."}, {"u": 5, "f": "Desistimiento por onerosidad (270.4 y 290.6)", "b": "Disposición general de otra Administración o avances técnicos obligatorios posteriores que suban los costes ≥ 5 % de la cifra de negocios anual. Desistimiento sin indemnización para ninguna parte."}, {"u": 5, "f": "DA 57.ª [sic]: vivienda social o asequible", "b": "80 años · sin anteproyecto ni proyecto previos · estudio económico-financiero sin información pública, ONE ni Comité de Precios · tasa: bono 10 años a +400 pb · pliego sin umbral de beneficio ni riesgos · cesión sin el 20 %, pero no antes de acabar la obra."}, {"u": 5, "f": "Secuestro o intervención (263 y 293)", "b": "Imposibilidad temporal con grave daño social o incumplimiento grave. Explotación por la Administración por cuenta y riesgo del concesionario. Máximo 3 años. En servicios, solo si es servicio público, en los términos del 263."}, {"u": 5, "f": "Causas de resolución de las concesiones (279 y 294)", "b": "Las del 211 salvo d) y e) + ejecución hipotecaria desierta · demora de la Administración > 6 meses · rescate (más eficaz y eficiente) · supresión · imposibilidad por acuerdos posteriores · secuestro prolongado."}, {"u": 5, "f": "Efectos de la resolución de la concesión de obras", "b": "Imputable a la Administración: inversiones con amortización lineal (+ daños y beneficios futuros en b-e). No imputable: incautación de garantía y nueva licitación por subasta al alza; tipo por flujos de caja (bono 10 años + 300 pb) o 70 % de la inversión; desierta → 50 %."}, {"u": 5, "f": "Corrección: la «RPA»", "b": "Terminología del texto refundido de 2011. La LCSP habla de «valor de la concesión» (281) y fija el tipo en el art. 282."}, {"u": 5, "f": "Concesión de servicios: régimen previo (284-285)", "b": "Nunca ejercicio de autoridad · régimen jurídico del servicio público · estudio de viabilidad vinculante si es inviable · lotes · tarifas y canon · cambio de control con el 51 % · anexo IV: procedimiento restringido (131.2)."}, {"u": 5, "f": "Acción concertada (art. 11.6)", "b": "Fuera de la LCSP la prestación de servicios sociales por simple financiación o autorizaciones a todas las entidades que cumplan, sin límites ni cuotas. Ampara los modelos autonómicos con entidades sin ánimo de lucro."}, {"u": 6, "f": "Siempre son suministro (16.3)", "b": "Entregas sucesivas por precio unitario · equipos y programas informáticos y de telecomunicaciones (salvo programas a medida = servicios) · fabricación · energía. No: propiedades incorporales ni valores negociables. Inmuebles: Ley 33/2003."}, {"u": 6, "f": "Riesgo y custodia en el suministro (300)", "b": "Antes de la entrega: sin indemnización por pérdidas salvo mora de la Administración en recibir. Entre la entrega y la recepción formal: custodia de la Administración. Perecederos recibidos: responde la Administración."}, {"u": 6, "f": "Pago del suministro (301-302)", "b": "Lo entregado y formalmente recibido · unidades +10 % sin expediente si lo prevé el pliego · pago parcial en bienes de la misma clase ≤ 50 % del precio."}, {"u": 6, "f": "Garantía en el suministro (305)", "b": "Vicios durante la garantía: reposición o reparación. Si no bastan: rechazo sin pago o con recuperación del precio. Sin reparos al terminar: el contratista queda exento."}, {"u": 6, "f": "Arrendamiento y fabricación", "b": "Arrendamiento (298): mantenimiento a cargo del arrendador, canon aparte; máx. 5 años (29.5). Fabricación (299): normas de obras que diga el pliego, salvo publicidad y adjudicación (examen 2022)."}, {"u": 6, "f": "Resolución del suministro (306-307)", "b": "No iniciar (desistimiento o suspensión > 4 meses): 3 % · desistimiento iniciado o suspensión > 8 meses: 6 % de lo dejado de suministrar. Devolución recíproca de bienes y pagos."}, {"u": 7, "f": "Prohibiciones en el contrato de servicios", "b": "Ejercicio de autoridad (17) · instrumentar contratación de personal, también en menores (308.2) · consolidación del personal del contratista a la extinción (308.2)."}, {"u": 7, "f": "Propiedad intelectual y precio (308.1 y 309)", "b": "Salvo pliego, cesión de los derechos a la Administración. Precio por componentes, unidades, tiempo, tanto alzado o tarifas; variación de unidades ≤ 10 % no es modificación si lo prevé el pliego."}, {"u": 7, "f": "Adjudicación de servicios", "b": "Calidad ≥ 51 % en anexo IV e intelectuales (145.4) · precio nunca único en intelectuales, sociales, sanitarios, educativos, intensivos en mano de obra y seguridad privada (145.3.g) · experiencia del personal valorable (145.2.2.º) · especificaciones imprecisas: negociación o diálogo (167)."}, {"u": 7, "f": "Servicios a la ciudadanía (art. 312)", "b": "Régimen jurídico previo · continuidad y uso garantizado · daños a terceros · bienes inembargables · secuestro hasta que desaparezca la perturbación · poderes de policía · dependencias diferenciadas."}, {"u": 7, "f": "Resolución de servicios (313)", "b": "No iniciar (desistimiento o suspensión > 4 meses): 3 % · desistimiento iniciado o suspensión > 8 meses: 6 % · complementarios al resolverse el principal: 3 %. Se paga lo realizado y recibido."}, {"u": 7, "f": "Proyectos de obras: subsanación (314)", "b": "Plazo ≤ 2 meses. Si no: resolver (incautación + 25 % del precio) o nuevo plazo de 1 mes improrrogable con penalidad del 25 %. Nuevo incumplimiento: indemnización igual al precio + pérdida de la garantía."}, {"u": 7, "f": "Proyectos de obras: desviación y responsabilidad (315)", "b": "Desviación > 20 %: minoración obligatoria del precio del proyecto: 30 % (20-30) · 40 % (30-40) · 50 % (> 40). Daños: 50 % hasta 5 veces el precio, exigible 10 años desde la recepción del proyecto. (No es el art. 316.)"}, {"u": 8, "f": "Contratos mixtos (art. 18)", "b": "Obras/suministros/servicios: prestación principal (anexo IV con otros, o servicios con suministros: mayor valor). Con concesiones separables en contrato único: normas de obras/sum./serv. si esas prestaciones superan los umbrales; si no, concesiones. Obra > 50.000: proyecto."}, {"u": 8, "f": "Subvencionados SARA (art. 23)", "b": "Entidades no poderes adjudicadores, subvención directa > 50 %: obras de ingeniería civil, hospitales, deportivos, ocio, escolares, universitarios y administrativos ≥ 5.404.000 €; servicios vinculados ≥ 216.000 €."}, {"u": 8, "f": "Duraciones del art. 29", "b": "Suministros y servicios: 5 años con prórrogas · mantenimiento exclusivo con la compra: vida útil · servicios a personas: más si lo exige la continuidad (sin tope) · arrendamiento: 5 · concesión de obras: 40 · concesión de servicios: 40 con obras, 25 sin ellas, 10 sanitarios · vivienda: 80 · acuerdo marco: 4 · menor: 1."}, {"u": 8, "f": "Prórrogas (29.2 y 29.4)", "b": "Las acuerda el órgano; obligatorias con preaviso de 2 meses; nunca tácitas. Prórroga de continuidad: máx. 9 meses si el anuncio del nuevo se publicó ≥ 3 meses antes."}, {"u": 9, "f": "Requisitos del medio propio (32.2)", "b": "1) Control análogo · 2) > 80 % de actividad para quien lo controla · 3) capital 100 % público si es de Derecho privado · 4) reconocimiento expreso en estatutos. El encargo no es contrato."}, {"u": 9, "f": "Reglas de los encargos", "b": "Publicación si > 50.000 € (63.6) · subcontratación ≤ 50 % (32.7) · el medio propio no concurre a licitaciones de su poder adjudicador · sin requisitos: anulable (40). Ejemplos: TRAGSA, FNMT, INECO."}, {"u": 9, "f": "Racionalización técnica (218-230)", "b": "Acuerdos marco (máx. 4 años) · sistemas dinámicos (electrónicos, uso corriente, abiertos) · centrales de contratación. No son tipos de contrato."}, {"u": 9, "f": "Contratación centralizada estatal", "b": "Declara el Ministro de Hacienda · contrata la Junta de Contratación Centralizada · gestiona la DGRCC (adjudica los basados) · catálogo: Orden HAC/459/2026 (desde 13/05/2026) · informe de la Agencia Estatal de Administración Digital en proyectos TIC singulares."}, {"u": 10, "f": "Introducción de contratación: las cuatro piezas", "b": "1) Constitución: art. 149.1.18.ª · 2) Ley 9/2017 (en adelante, LCSP), con las Directivas 2014/23 y 2014/24 · 3) RD 1098/2001, en lo que no se oponga · 4) objeto: art. 1; umbrales de la Orden HAC/1517/2025."}, {"u": 10, "f": "Calificación previa del Tema 6", "b": "Con carácter previo, procede calificar: oneroso (2) · AP y poder adjudicador (3) · tipo con su artículo (13-17) y su régimen propio (231-315) · riesgo operacional (14.4) · administrativo (25) · valor estimado, SARA y recurso especial."}, {"u": 10, "f": "Mini-supuesto: rehabilitación del Ministerio", "b": "PBL 1.452.000 / 1,21 = 1.200.000 (VEC) → no SARA, sin recurso especial, clasificación exigible, supervisión omitida (235) · suspensión del inicio 1/4 → > 4 meses el 15/8 → 245.b → 3 % de 1.000.000 = 30.000 €."}, {"u": 10, "f": "Dato que falta en el enunciado", "b": "«El enunciado no precisa…, por lo que suponemos que…» (con su justificación) y después «Por tanto, se concluye que…». Nunca un condicional dubitativo en la conclusión ni coletillas de cierre."}];
const UNAMES={"1": "Tipología", "2": "Obras: preparación", "3": "Obras: ejecución", "4": "Obras: resolución", "5": "Concesiones", "6": "Suministro", "7": "Servicios", "8": "Mixtos y duración", "9": "Medios propios y racionalización", "10": "Supuesto"};
const SK="gace27_biv_t06_fc_v1";

function r(i){return db[i]||{ok:0,ko:0,last:null}}
let st={unit:0,mode:"all",order:[],pos:0,flipped:false};
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function build(){
  let ids=CARDS.map((c,i)=>i).filter(i=>st.unit===0||CARDS[i].u===st.unit);
  if(st.mode==="pend")ids=ids.filter(i=>r(i).last!=="ok");
  st.order=shuffle(ids);st.pos=0;st.flipped=false;
}
function renderNav(){
  const t=[{v:0,l:"Todo el tema"},...Object.keys(UNAMES).map(k=>({v:+k,l:UNAMES[k]}))];
  document.getElementById("nav").innerHTML=t.map(x=>`<button class="nb${st.unit===x.v?" active":""}" onclick="setUnit(${x.v})">${x.l}</button>`).join("");
}
function renderStats(){
  const ids=CARDS.map((c,i)=>i).filter(i=>st.unit===0||CARDS[i].u===st.unit);
  const ok=ids.filter(i=>r(i).last==="ok").length, ko=ids.filter(i=>r(i).last==="ko").length;
  document.getElementById("stats").innerHTML=`<div class="stat"><div class="stat-n" style="color:#0f6e56">${ok}</div><div class="stat-l">Sabidas</div></div><div class="stat"><div class="stat-n" style="color:#a32d2d">${ko}</div><div class="stat-l">Por repasar</div></div><div class="stat"><div class="stat-n">${ids.length-ok-ko}</div><div class="stat-l">Sin ver</div></div>`;
}
function renderCtrl(){
  document.getElementById("ctrl").innerHTML=`<button class="btn${st.mode==="all"?" active":""}" onclick="setMode('all')">Todas</button><button class="btn${st.mode==="pend"?" active":""}" onclick="setMode('pend')">Solo pendientes</button><button class="btn" onclick="build();render()">🔀 Barajar</button><button class="btn danger" style="margin-left:auto" onclick="resetAll(this)">Reiniciar progreso</button>`;
}
function resetAll(b){
  if(b.dataset.armed){db={};save();build();renderAll();return}
  b.dataset.armed="1";b.textContent="Pulsa otra vez para borrar";
  setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent="Reiniciar progreso"}},3000);
}
function render(){
  renderStats();
  const s=document.getElementById("stage");
  if(!st.order.length){s.innerHTML=`<div class="empty">${st.mode==="pend"?"No te queda ninguna pendiente en este bloque. Pulsa «Todas» para repasar el mazo completo.":"No hay tarjetas en este bloque."}</div>`;return}
  if(st.pos>=st.order.length){s.innerHTML=`<div class="empty">Ronda terminada.<br><br><button class="btn active" onclick="build();render()">Empezar otra ronda</button></div>`;return}
  const i=st.order[st.pos],c=CARDS[i];
  s.innerHTML=`<div class="card${st.flipped?" back-side":""}" tabindex="0" role="button" aria-label="Girar tarjeta" onclick="flip()" onkeydown="if(event.key==='Enter'){flip()}">
    <div class="meta"><span>${UNAMES[c.u]}</span><span>${st.pos+1} / ${st.order.length}</span></div>
    <div class="face">${st.flipped?c.b:c.f}</div>
    <div class="hint">${st.flipped?"¿La sabías?":"Toca la tarjeta o pulsa espacio para ver la respuesta"}</div></div>
    <div class="answer"><button class="no" ${st.flipped?"":"disabled"} onclick="mark('ko')">✗ No la sabía</button><button class="si" ${st.flipped?"":"disabled"} onclick="mark('ok')">✓ La sabía</button></div>
    <div class="dots">${st.order.map((id,k)=>`<span class="dot ${r(id).last==="ok"?"ok":r(id).last==="ko"?"ko":""}${k===st.pos?" cur":""}"></span>`).join("")}</div>`;
}
function flip(){st.flipped=!st.flipped;render()}
function mark(v){const i=st.order[st.pos],x=r(i);x[v]++;x.last=v;db[i]=x;save();if(v==="ko")st.order.push(i);st.pos++;st.flipped=false;render()}
function setUnit(u){st.unit=u;build();renderAll()}
function setMode(m){st.mode=m;build();renderAll()}
function renderAll(){renderNav();renderCtrl();render()}
document.addEventListener("keydown",e=>{if(e.target.tagName==="BUTTON")return;if(e.code==="Space"){e.preventDefault();flip()}else if(st.flipped&&e.key==="ArrowRight")mark("ok");else if(st.flipped&&e.key==="ArrowLeft")mark("ko")});
build();renderAll();
</script>
</body>
</html>
