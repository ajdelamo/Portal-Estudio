const LS_KEY='gace_biv_t7t8_v1';
const UNIDADES={7:'T7 · Actividad y Subvenciones',8:'T8 · Expropiación'};
const BANK=[
// ============ T7 (u:7) ============
{u:7,t:"La clasificación clásica de las formas de actividad administrativa (Jordana de Pozas) distingue:",o:["Policía, fomento y servicio público","Intervención, sanción y arbitraje","Fomento, planificación y gestión","Autorización, concesión y sanción"],c:0,e:"Policía (limitación), fomento (estímulo) y servicio público (prestación). La doctrina posterior añade la actividad arbitral y la empresarial."},
{u:7,t:"Los principios de intervención de las Administraciones en la actividad de los ciudadanos (necesidad, proporcionalidad, medida menos restrictiva) se recogen en:",o:["El art. 129 de la Ley 39/2015","El art. 4 de la Ley 40/2015","El art. 103 CE","El art. 84 LRBRL"],c:1,e:"Art. 4 Ley 40/2015, transposición de la Directiva 2006/123/CE (Bolkestein). El 129 Ley 39/2015 son los principios de buena regulación."},
{u:7,t:"La declaración responsable permite ejercer el derecho o iniciar la actividad:",o:["Tras la resolución expresa de la Administración","Desde el día de su presentación (art. 69.3 Ley 39/2015)","A los 20 días si no hay oposición","Tras la inspección previa"],c:1,e:"Art. 69.3: reconocimiento o ejercicio desde el día de la presentación, sin perjuicio de las facultades de comprobación posteriores. La inexactitud esencial impide continuar desde que se constate."},
{u:7,t:"La diferencia entre autorización y concesión es que:",o:["No hay diferencia práctica","La autorización remueve límites a un derecho preexistente; la concesión crea el derecho ex novo","La concesión es siempre temporal y la autorización indefinida","La autorización se otorga por ley"],c:1,e:"Distinción doctrinal clásica: la autorización presupone un derecho del particular; la concesión constituye un derecho nuevo (típicamente sobre dominio o servicio público)."},
{u:7,t:"Las infracciones administrativas graves prescriben, salvo norma especial, a los:",o:["6 meses","2 años (art. 30 Ley 40/2015)","3 años","4 años"],c:1,e:"Art. 30 Ley 40/2015: infracciones — muy graves 3 años, graves 2, leves 6 meses; sanciones — 3, 2 y 1 año. En subvenciones el régimen especial es de 4 años (art. 65 LGS)."},
{u:7,t:"La creación de un servicio público local exige:",o:["Decreto del Alcalde","Acuerdo del Pleno por mayoría absoluta (art. 47.2.k LRBRL)","Autorización autonómica en todo caso","Ley estatal"],c:1,e:"Además de la publicatio (reserva legal, art. 128.2 CE para recursos y servicios esenciales) y el expediente acreditativo de oportunidad."},
{u:7,t:"Tras la Ley 9/2017, la gestión indirecta de servicios públicos se articula mediante:",o:["El contrato de gestión de servicios públicos","La concesión de servicios (con riesgo operacional) o el contrato de servicios (sin él)","El concierto y el arrendamiento exclusivamente","La encomienda de gestión"],c:1,e:"El contrato de gestión de servicios públicos desapareció como tipo. El criterio delimitador es la transferencia del riesgo operacional."},
{u:7,t:"Los consorcios, tras la Ley 40/2015:",o:["Son entidades privadas","Deben adscribirse obligatoriamente a una Administración Pública (arts. 118-127)","No pueden integrar entidades privadas","Son asociaciones exclusivamente municipales"],c:1,e:"Adscripción obligatoria conforme a los criterios del art. 120, que determina su régimen presupuestario y de personal. Las asociaciones solo de municipios son las mancomunidades (art. 44 LRBRL)."},
{u:7,t:"El concepto legal de subvención (art. 2.1 LGS) exige:",o:["Entrega dineraria o en especie con contraprestación","Entrega sin contraprestación directa, sujeta a un objetivo y con finalidad de fomento","Cualquier ayuda pública económica","Transferencias entre Administraciones"],c:1,e:"Tres requisitos cumulativos. No son subvenciones (2.4): aportaciones globales entre Administraciones, becas al personal, premios sin previa solicitud, subvenciones electorales, cuotas internacionales."},
{u:7,t:"¿Cuál de los siguientes NO es subvención según el art. 2.4 LGS?",o:["Una ayuda a una ONG para un proyecto","Un premio concedido sin previa solicitud del beneficiario","Una beca a un estudiante universitario","Una ayuda a una empresa para contratar"],c:1,e:"Los premios sin previa solicitud están expresamente excluidos, igual que las becas al personal propio (no a terceros) y las aportaciones globales entre Administraciones."},
{u:7,t:"Los principios de gestión de las subvenciones (art. 8.3 LGS) son:",o:["Publicidad, transparencia, concurrencia, objetividad, igualdad y no discriminación + eficacia y eficiencia","Legalidad, jerarquía y publicidad","Anualidad, unidad y universalidad","Mérito y capacidad"],c:0,e:"Además, el art. 8.1 exige la aprobación previa del Plan Estratégico de Subvenciones (objetivos, plazos, costes y financiación)."},
{u:7,t:"En la AGE, la competencia para conceder subvenciones corresponde a:",o:["El Consejo de Ministros","Los Ministros y los Secretarios de Estado (art. 10.1 LGS)","Los Subsecretarios","La IGAE"],c:1,e:"Art. 10.1 LGS. En el ámbito local: Alcalde o Pleno según la legislación de régimen local y las bases de ejecución."},
{u:7,t:"La entidad colaboradora en materia de subvenciones:",o:["Recibe los fondos e integra los mismos en su patrimonio","Entrega y distribuye los fondos en nombre y por cuenta del concedente, sin integrarlos en su patrimonio","Es siempre una entidad privada","Sustituye al beneficiario"],c:1,e:"Art. 12 LGS. Requiere convenio de colaboración. El beneficiario (art. 11) es quien realiza la actividad subvencionada."},
{u:7,t:"El procedimiento ordinario de concesión de subvenciones es:",o:["La concesión directa","La concurrencia competitiva, iniciada siempre de oficio mediante convocatoria (arts. 22.1 y 23)","El procedimiento negociado","La adjudicación nominativa"],c:1,e:"Comparación de solicitudes conforme a los criterios de las bases, con prelación y límite del crédito. La concesión directa (22.2) es excepcional y tasada."},
{u:7,t:"La concesión directa de subvenciones procede:",o:["Cuando lo decida el órgano concedente","En 3 supuestos tasados: nominativas en presupuestos, impuestas por norma legal y razones excepcionales de interés público acreditadas","Para importes inferiores a 3.000 €","Cuando solo hay un posible beneficiario"],c:1,e:"Art. 22.2 LGS. En la AGE, las del supuesto c) requieren Real Decreto aprobando las normas especiales (art. 28)."},
{u:7,t:"El plazo máximo para resolver y notificar en concurrencia competitiva es de ___ y el silencio es ___:",o:["3 meses · estimatorio","6 meses desde la publicación de la convocatoria · desestimatorio (art. 25.4 y 25.5)","6 meses · estimatorio","12 meses · desestimatorio"],c:1,e:"Excepción expresa a la regla del silencio positivo del art. 24.1 Ley 39/2015."},
{u:7,t:"¿Cuál NO es gasto subvencionable (art. 31 LGS)?",o:["El coste de la actividad a valor de mercado","Los intereses deudores de las cuentas bancarias","Los gastos pagados antes del fin del período de justificación","Los costes indirectos imputados en la parte correspondiente"],c:1,e:"Excluidos: intereses deudores, intereses, recargos y sanciones administrativas y penales, y gastos de procedimientos judiciales."},
{u:7,t:"El plazo de prescripción del derecho de la Administración a reconocer o liquidar el reintegro es de:",o:["1 año","4 años (art. 39 LGS)","5 años","15 meses"],c:1,e:"Desde que finaliza el plazo de justificación. No confundir con la caducidad del procedimiento de reintegro ya iniciado: 12 meses (art. 42.4)."},
{u:7,t:"El procedimiento de reintegro caduca si no se resuelve en:",o:["6 meses","12 meses desde el acuerdo de iniciación (art. 42.4 LGS)","3 meses","4 años"],c:1,e:"La caducidad no impide iniciar un nuevo procedimiento mientras no prescriba el derecho (4 años). El reintegro incluye interés de demora desde el pago de la subvención."},
{u:7,t:"El interés de demora en el reintegro se computa:",o:["Desde el acuerdo de reintegro","Desde el momento del pago de la subvención hasta que se acuerde la procedencia del reintegro (art. 37.1)","Desde la finalización de la actividad","Desde el requerimiento"],c:1,e:"Es la regla del art. 37.1 LGS. Sumado a las causas: falseamiento, incumplimiento del objetivo, de la justificación, resistencia a la comprobación, etc."},
{u:7,t:"Las infracciones en materia de subvenciones prescriben a los:",o:["6 meses, 2 y 3 años según gravedad","4 años en todo caso (art. 65 LGS)","5 años","2 años"],c:1,e:"Régimen especial subvencional: 4 años tanto para infracciones como para sanciones, distinto del general del art. 30 Ley 40/2015."},
{u:7,t:"La Base de Datos Nacional de Subvenciones (BDNS):",o:["Es voluntaria para las Entidades Locales","Es obligatoria para todas las Administraciones desde el 1/1/2016; sin remisión no hay eficacia de la convocatoria","Solo aplica a la AGE","Sustituye a la publicación en el BOE"],c:1,e:"Art. 20 LGS: la publicación del extracto de la convocatoria en el diario oficial se hace por conducto de la BDNS."},
{u:7,t:"El control financiero de las subvenciones de la AGE corresponde a:",o:["El Tribunal de Cuentas en exclusiva","La Intervención General de la Administración del Estado (IGAE), sin perjuicio del control externo del Tribunal de Cuentas","El Consejo de Estado","La AEAT"],c:1,e:"Arts. 44-51 LGS: control financiero interno de la IGAE; control externo del Tribunal de Cuentas."},
{u:7,t:"El beneficiario debe conservar los documentos justificativos durante:",o:["2 años","4 años (art. 14.1.g LGS)","6 años","10 años"],c:1,e:"En tanto puedan ser objeto de comprobación y control. Coincide con el plazo de prescripción del reintegro."},
// ============ T8 (u:8) ============
{u:8,t:"El fundamento constitucional de la expropiación forzosa es:",o:["El art. 128 CE","El art. 33.3 CE","El art. 106.2 CE","El art. 132 CE"],c:1,e:"Art. 33.3: causa justificada de utilidad pública o interés social + correspondiente indemnización + de conformidad con las leyes. El 106.2 es la responsabilidad patrimonial."},
{u:8,t:"La competencia para legislar sobre expropiación forzosa:",o:["Es compartida Estado-CCAA","Es exclusiva del Estado en su integridad (art. 149.1.18ª CE, sin el calificativo 'básica')","Corresponde a las CCAA con Estatuto reformado","Es local en el ámbito municipal"],c:1,e:"Toda la legislación expropiatoria es estatal (LEF 1954 y REF 1957); las CCAA pueden EJERCER la potestad expropiatoria, no regular el instituto."},
{u:8,t:"Según el art. 2 LEF, pueden ser titulares de la potestad expropiatoria:",o:["Cualquier entidad del sector público","El Estado, las CCAA, la Provincia y el Municipio","Solo el Estado","Los concesionarios de obras públicas"],c:1,e:"Los concesionarios pueden ser BENEFICIARIOS, no expropiantes. Los organismos públicos, solo si sus estatutos les atribuyen la potestad."},
{u:8,t:"En la expropiación por interés social, puede ser beneficiario:",o:["Solo la Administración","Cualquier persona natural o jurídica que reúna los requisitos de la ley especial","Solo los concesionarios","Solo entidades sin ánimo de lucro"],c:1,e:"Por utilidad pública: Administraciones y concesionarios a quienes la ley lo reconozca. Por interés social: además, cualquier persona (art. 2.3 LEF)."},
{u:8,t:"Si el expropiado no comparece o la propiedad es litigiosa, interviene en el expediente:",o:["El Defensor del Pueblo","El Ministerio Fiscal (art. 5 LEF)","El Abogado del Estado en su representación","Un administrador judicial"],c:1,e:"También cuando los titulares estén incapacitados sin representante. La identificación del expropiado sigue la prelación del art. 3: registros públicos → fiscales → notoriedad."},
{u:8,t:"Los bienes de dominio público:",o:["Se expropian por el procedimiento de urgencia","No se expropian: su cambio de destino se realiza mediante mutación demanial","Se expropian previa desafectación automática","Se expropian con autorización del Consejo de Estado"],c:1,e:"Son inalienables (art. 132 CE). La expropiación recae sobre propiedad privada y derechos patrimoniales legítimos (art. 1 LEF)."},
{u:8,t:"El plazo de información pública en la fase de necesidad de ocupación es de:",o:["10 días","15 días (art. 18 LEF)","20 días","1 mes"],c:1,e:"Tras ella, el Delegado del Gobierno resuelve en 20 días (art. 20). El acuerdo de necesidad de ocupación inicia el expediente expropiatorio (art. 21)."},
{u:8,t:"El recurso de alzada contra el acuerdo de necesidad de ocupación:",o:["No tiene efectos suspensivos","Tiene efectos suspensivos hasta que se dicte resolución expresa (art. 22.3 LEF)","Es un recurso potestativo de reposición","No cabe recurso alguno"],c:1,e:"Excepción a la regla general del art. 117 Ley 39/2015. Los plazos del art. 22 LEF se entienden actualizados por la Ley 39/2015: 1 mes de interposición y 3 meses de resolución."},
{u:8,t:"Cuando la expropiación parcial haga antieconómica la conservación del resto de la finca, el propietario puede solicitar la expropiación total en:",o:["10 días (art. 23 LEF)","15 días","20 días","3 meses"],c:0,e:"Art. 23 LEF. Si la Administración no accede, deberá incluir en el justiprecio la indemnización por los perjuicios de la expropiación parcial."},
{u:8,t:"En el justiprecio por hojas de aprecio, el expropiado presenta su hoja en ___ y la Administración acepta o rechaza en ___:",o:["10 y 10 días","20 y 20 días (arts. 29-30 LEF)","15 y 30 días","30 y 15 días"],c:1,e:"Si la Administración rechaza, formula su propia hoja, que el expropiado puede aceptar o rechazar en 10 días. Sin acuerdo → Jurado Provincial de Expropiación. Previamente: 15 días para el mutuo acuerdo (art. 24)."},
{u:8,t:"El Jurado Provincial de Expropiación está presidido por:",o:["El Delegado del Gobierno","Un Magistrado designado por el Presidente de la Audiencia Provincial (art. 32 LEF)","El Presidente de la Diputación","Un Abogado del Estado"],c:1,e:"Composición: Magistrado-presidente, Abogado del Estado, dos funcionarios técnicos, un vocal sectorial según la naturaleza del bien, un Notario y el Interventor Territorial."},
{u:8,t:"La resolución del Jurado Provincial de Expropiación:",o:["Es recurrible en alzada ante el Ministro","Agota la vía administrativa y solo cabe recurso contencioso-administrativo","Requiere aprobación del Consejo de Ministros","Es irrecurrible"],c:1,e:"Arts. 34-35 LEF. Además rige la congruencia: no puede fijar menos de lo ofrecido por la Administración ni más de lo pedido por el expropiado."},
{u:8,t:"Fijado el justiprecio, el plazo para el pago es de:",o:["3 meses","6 meses (art. 48 LEF)","1 año","30 días"],c:1,e:"El pago está exento de impuestos. Si el expropiado rehúsa o hay litigio: consignación en la Caja General de Depósitos (art. 50), con derecho a percibir la parte no discutida."},
{u:8,t:"El premio de afección consiste en:",o:["Un 10% del justiprecio a solicitud del expropiado","Un 5% adicional, automático, sobre el justiprecio (art. 47 LEF)","Un 5% solo en expropiaciones urgentes","Los intereses legales del justiprecio"],c:1,e:"Compensa el valor de afección o apego. No requiere solicitud y se calcula sobre el valor del bien y demás conceptos del justiprecio."},
{u:8,t:"Los intereses del art. 56 LEF se devengan cuando:",o:["Transcurren 6 meses desde la iniciación del expediente sin haberse fijado el justiprecio","Transcurre 1 año desde la ocupación","Se declara la urgencia","El expropiado lo solicita"],c:0,e:"Demora en la FIJACIÓN: interés legal desde los 6 meses de la iniciación. Art. 57: demora en el PAGO — interés legal si pasan 6 meses desde la fijación sin pagar."},
{u:8,t:"La retasación (art. 58 LEF) procede cuando:",o:["Transcurren 2 años sin pago","Transcurren 4 años sin que el pago se haga efectivo o se consigne","Transcurren 6 meses desde la fijación","El justiprecio queda desfasado por la inflación"],c:1,e:"4 años en la redacción vigente (Ley 17/2012; la originaria decía 2). Efectuado el pago o la consignación, ya no procede aunque pase el plazo. Cuidado con temarios antiguos."},
{u:8,t:"Procede la reversión cuando no se ejecuta la obra ni se establece el servicio en el plazo de:",o:["2 años desde el justiprecio","5 años desde la toma de posesión (art. 54 LEF)","10 años desde el acta de ocupación","20 años"],c:1,e:"También: suspensión de la ejecución por más de 2 años, y parte sobrante o desafectación antes de 20 años desde la toma de posesión."},
{u:8,t:"NO procede la reversión cuando:",o:["La obra se retrasa por causas presupuestarias","La afectación al fin se prolongó durante 10 años desde la terminación de la obra o el establecimiento del servicio","La Administración lo decide discrecionalmente","El bien se revaloriza"],c:1,e:"Art. 54.2: tampoco cuando simultáneamente a la desafectación se acuerda justificadamente una nueva afectación a otro fin de utilidad pública o interés social."},
{u:8,t:"El plazo para ejercitar la reversión tras la notificación del supuesto reversional es de:",o:["1 mes","3 meses (art. 54.3 LEF)","6 meses","1 año"],c:1,e:"El reversionista restituye la indemnización percibida ACTUALIZADA conforme al IPC (art. 55); nueva valoración si el bien sufrió cambios sustanciales. Derecho preferente inscribible (54.5)."},
{u:8,t:"La declaración de urgente ocupación (art. 52 LEF) corresponde a:",o:["El Delegado del Gobierno","El Consejo de Ministros (u órgano autonómico equivalente), con retención de crédito","El Jurado Provincial","El Ministro de Hacienda"],c:1,e:"Acuerdo motivado con retención de crédito por el importe estimado del justiprecio. Lleva implícita la necesidad de ocupación."},
{u:8,t:"En el procedimiento de urgencia, el acta previa a la ocupación exige notificación a los interesados con una antelación mínima de:",o:["48 horas","8 días (art. 52.2ª LEF)","15 días","20 días"],c:1,e:"Tras las hojas de depósito previo y la consignación, la ocupación debe producirse en el plazo máximo de 15 días. Después se tramita el justiprecio ordinario: primero se ocupa, luego se paga."},
{u:8,t:"El efecto esencial del procedimiento de urgencia es:",o:["Reducir el justiprecio","Invertir el orden: ocupación inmediata previa consignación del depósito, y justiprecio y pago posteriores","Suprimir el premio de afección","Eliminar la reversión"],c:1,e:"Excepción a la regla del previo pago; el TC lo admite porque la indemnización queda garantizada (depósito previo + indemnización por rápida ocupación)."},
{u:8,t:"Frente a una ocupación de bienes sin procedimiento expropiatorio (vía de hecho), el particular puede:",o:["Solo reclamar responsabilidad patrimonial","Acudir a la tutela sumaria posesoria (interdictos) y a la jurisdicción contencioso-administrativa (art. 125 LEF)","Únicamente negociar el justiprecio","Pedir la retasación"],c:1,e:"La vía de hecho excluye los privilegios de la expropiación regular: cabe la defensa posesoria civil y la nulidad en vía contenciosa."},
{u:8,t:"El acta de ocupación acompañada del justificante del pago:",o:["Carece de efectos registrales","Es título bastante para inscribir la transmisión en el Registro de la Propiedad y cancelar cargas (art. 53 LEF)","Requiere elevación a escritura pública","Solo produce efectos entre las partes"],c:1,e:"Título inscribible con cancelación de cargas anteriores incompatibles: manifestación del principio de adquisición libre de cargas (art. 8 LEF)."}
];

let unidadSel='all', modo='normal';
function saveHist(){localStorage.setItem(LS_KEY,JSON.stringify(hist))}
function qid(q){return q.u+'|'+q.t.slice(0,60)}
function shuffle(a){const r=[...a];for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]]}return r}
function ratio(q){const h=hist[qid(q)];if(!h||h.n===0)return null;return h.ok/h.n}
function buildPool(){
  let pool=BANK.filter(q=>unidadSel==='all'||q.u===unidadSel);
  if(modo==='fail'){pool=pool.filter(q=>{const h=hist[qid(q)];return h&&h.n>0&&h.ok<h.n})}
  if(modo==='adapt'){pool=[...pool].sort((a,b)=>{const ra=ratio(a),rb=ratio(b);return (ra===null?-1:ra)-(rb===null?-1:rb)}).slice(0,20)}
  else{pool=shuffle(pool)}
  return pool.map(q=>{const idx=shuffle(q.o.map((_,i)=>i));return{...q,idx}});
}
function render(reshuffle){
  const tabs=document.getElementById('tabs');
  tabs.innerHTML='';
  const mk=(v,l)=>{const b=document.createElement('button');b.className='tab'+(unidadSel===v?' on':'');b.textContent=l;b.onclick=()=>{unidadSel=v;render(true)};tabs.appendChild(b)};
  mk('all','📋 Todas ('+BANK.length+')');
  for(const u in UNIDADES){mk(Number(u),UNIDADES[u]+' ('+BANK.filter(q=>q.u==u).length+')')}
  document.querySelectorAll('.mode').forEach(b=>{b.classList.toggle('on',b.dataset.m===modo);b.onclick=()=>{modo=b.dataset.m;render(true)}});
  renderBars();
  const cont=document.getElementById('quiz');cont.innerHTML='';
  const pool=buildPool();
  if(pool.length===0){cont.innerHTML='<div class="q"><h3>🎉 No hay preguntas en este modo (ninguna errónea pendiente).</h3></div>';updateScore();return}
  pool.forEach((q,n)=>{
    const d=document.createElement('div');d.className='q';
    const h=hist[qid(q)];
    d.innerHTML='<div class="meta"><span>'+UNIDADES[q.u]+' · Pregunta '+(n+1)+'/'+pool.length+'</span><span>'+(h&&h.n?('histórico: '+h.ok+'/'+h.n):'nueva')+'</span></div><h3>'+q.t+'</h3>';
    q.idx.forEach(i=>{
      const b=document.createElement('button');b.className='opt';b.textContent=q.o[i];
      b.onclick=()=>{
        const id=qid(q);hist[id]=hist[id]||{ok:0,n:0};hist[id].n++;
        d.querySelectorAll('.opt').forEach(x=>x.disabled=true);
        if(i===q.c){b.classList.add('ok');hist[id].ok++}
        else{b.classList.add('ko');d.querySelectorAll('.opt').forEach(x=>{if(x.textContent===q.o[q.c])x.classList.add('ok')})}
        d.querySelector('.exp').classList.add('show');
        saveHist();renderBars();updateScore();
      };
      d.appendChild(b);
    });
    const e=document.createElement('div');e.className='exp';e.innerHTML='💡 '+q.e;d.appendChild(e);
    cont.appendChild(d);
  });
  updateScore();
}
function renderBars(){
  const el=document.getElementById('bars');el.innerHTML='';
  for(const u in UNIDADES){
    const qs=BANK.filter(q=>q.u==u);
    let ok=0,n=0;qs.forEach(q=>{const h=hist[qid(q)];if(h){ok+=h.ok;n+=h.n}});
    const pct=n?Math.round(100*ok/n):0;
    const col=pct<50?'#dc2626':pct<75?'#ea580c':'#16a34a';
    el.innerHTML+='<div class="bar"><div class="lbl"><span>'+UNIDADES[u]+'</span><span>'+(n?pct+'% ('+ok+'/'+n+')':'sin datos')+'</span></div><div class="track"><div class="fill" style="width:'+pct+'%;background:'+col+'"></div></div></div>';
  }
}
function updateScore(){
  let ok=0,n=0;BANK.forEach(q=>{const h=hist[qid(q)];if(h){ok+=h.ok;n+=h.n}});
  document.getElementById('score').innerHTML=n?('Histórico total: <b>'+ok+'</b> aciertos de <b>'+n+'</b> respuestas ('+Math.round(100*ok/n)+'%)'):'Responde para empezar a registrar tu progreso (se guarda en este navegador).';
}
function showAll(){document.querySelectorAll('.exp').forEach(e=>e.classList.add('show'))}
function resetHist(){if(confirm('¿Borrar todo el historial de este test?')){hist={};saveHist();render(true)}}
render(true);
</script>
</body>
</html>
